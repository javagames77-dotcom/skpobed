<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бухгалтерія — InSkill.online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{--bg:#ffffff;--bg2:#fafafa;--bg3:#f5f5f5;--border:#e8e8e8;--border2:#d0d0d0;--text:#1a1a1a;--muted:#6b6b6b;--muted2:#b0b0b0;--black:#0a0a0a;--nav-bg:rgba(255,255,255,.96);--sidebar-bg:#ffffff;--input-bg:#fafafa;--card-bg:#ffffff;--card-shadow:0 1px 3px rgba(0,0,0,.06);--tbl-hover:#fafafa;--accent:#E53935;--tag-green-bg:#f0fdf4;--tag-green:#16a34a;--tag-red-bg:#fff0f0;--tag-red:#c0392b;--tag-yellow-bg:#fffbeb;--tag-yellow:#d97706;--tag-blue-bg:#eff6ff;--tag-blue:#1d4ed8;--tag-gray-bg:#f5f5f5;--tag-gray:#6b6b6b;--p:#0066CC;--s:#FF9933}
[data-theme="dark"]{--bg:#0a0a0a;--bg2:#181818;--bg3:#222222;--border:#3d3d3d;--border2:#505050;--text:#ffffff;--muted:#bbbbbb;--muted2:#999999;--black:#ffffff;--nav-bg:rgba(10,10,10,.97);--sidebar-bg:#0a0a0a;--input-bg:#181818;--card-bg:#181818;--card-shadow:0 1px 3px rgba(0,0,0,.3);--tbl-hover:#222222;--accent:#E53935;--tag-green-bg:#0a2010;--tag-green:#4ade80;--tag-red-bg:#2a1010;--tag-red:#ff7070;--tag-yellow-bg:#2a1800;--tag-yellow:#fbbf24;--tag-blue-bg:#0c1a3a;--tag-blue:#93c5fd;--tag-gray-bg:#222222;--tag-gray:#999999;--p:#4d9de0;--s:#FF9933}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg2);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

/* ── NAV ── */
.nav{height:48px;background:var(--nav-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.logo-text{font-size:15px;font-weight:600;color:var(--black);letter-spacing:-.03em;transition:color .2s}
.logo-text span{font-weight:300;color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav-badge{font-size:10px;font-weight:500;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;letter-spacing:.02em}
.nav-divider{width:1px;height:18px;background:var(--border);flex-shrink:0}
.theme-toggle{width:32px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:all .15s}
.theme-toggle:hover{border-color:var(--border2)}
.lang-switcher{display:flex;align-items:center;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:3px;transition:all .2s}
.lang-btn{padding:3px 8px;border:none;border-radius:5px;background:transparent;color:var(--muted);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.lang-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav-btn{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .12s;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.nav-btn:hover{border-color:var(--border2);color:var(--text)}

/* ── LAYOUT ── */
.layout-outer{display:flex;height:calc(100vh - 48px)}

/* ── LEFT SIDEBAR (nav) ── */
.sidebar-nav{width:220px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .2s,border-color .2s;overflow-y:auto}
.sidebar-groups-list{flex:1;overflow-y:auto;min-height:0}
.sidebar-user{padding:14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--black);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.sidebar-user-name{font-size:12px;font-weight:500;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-id{font-size:10px;color:var(--muted2)}
.sidebar-section{padding:14px 12px 6px;font-size:10px;font-weight:500;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 6px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;text-align:left;width:calc(100% - 12px);text-decoration:none}
.sitem:hover{background:var(--bg3);color:var(--text)}
.sitem.active{background:var(--bg3);color:var(--black)}
.sitem svg{flex-shrink:0}

/* ── CENTER ── */
.center{flex:1;overflow:hidden;display:flex}
.group-item{padding:7px 12px;margin:1px 6px;cursor:pointer;border-radius:7px;transition:background .15s}
.group-item:hover{background:var(--bg3)}
.group-item.active{background:var(--tag-blue-bg)}
.group-item.active .group-item-name{color:var(--p)}
.group-item-name{font-size:12px;font-weight:500;color:var(--black)}
.group-item-club{font-size:11px;color:var(--muted);margin-top:1px}

/* ── MAIN AREA ── */
.main-area{flex:1;overflow-y:auto;padding:16px}

/* ── STATS STRIP ── */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--card-shadow)}
.stat-value{font-size:18px;font-weight:700;color:var(--black);line-height:1}
.stat-value.green{color:var(--tag-green)}
.stat-value.red{color:var(--tag-red)}
.stat-label{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;font-weight:500}

/* ── CARD ── */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--card-shadow);overflow:hidden;transition:all .2s}
.card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-title{font-size:13px;font-weight:600;color:var(--black)}

/* ── TABLE ── */
.acc-table{width:100%;border-collapse:collapse}
.acc-table thead tr{border-bottom:1px solid var(--border)}
.acc-table th{padding:9px 10px;text-align:left;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.acc-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.acc-table tbody tr:last-child td{border-bottom:none}
.acc-table tbody tr:hover td{background:var(--tbl-hover)}

/* ── ATHLETE ── */
.athlete-info{display:flex;align-items:center;gap:8px}
.athlete-photo{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.athlete-photo-placeholder{width:30px;height:30px;border-radius:50%;background:var(--p);color:#fff;font-size:10px;font-weight:600;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.athlete-name{font-size:12px;font-weight:500;color:var(--black)}

/* ── STATUS BADGES ── */
.status-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.status-active{background:var(--tag-green-bg);color:var(--tag-green)}
.status-overdue{background:var(--tag-red-bg);color:var(--tag-red)}
.status-trial{background:var(--tag-yellow-bg);color:var(--tag-yellow)}
.status-none{background:var(--tag-gray-bg);color:var(--tag-gray)}
.paid-until{font-size:11px;color:var(--muted);white-space:nowrap}
.paid-until.soon{color:var(--tag-yellow);font-weight:600}
.paid-until.overdue{color:var(--tag-red);font-weight:600}

/* ── PAYMENT ROW ── */
.pay-row{display:flex;align-items:center;gap:4px}
.sessions-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .12s;flex-shrink:0}
.sessions-btn:hover{border-color:var(--p);background:var(--tag-blue-bg);color:var(--p)}
.amount-input{width:70px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;font-family:inherit;outline:none;background:var(--input-bg);color:var(--text);transition:border-color .15s}
.amount-input:focus{border-color:var(--border2)}
.amount-input.filled{border-color:var(--tag-green);background:var(--tag-green-bg)}
.pay-type-select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit;outline:none;cursor:pointer;background:var(--input-bg);color:var(--text)}
.pay-type-select:focus{border-color:var(--border2)}

/* ── ACCEPT BUTTONS ── */
.btn-accept{background:var(--tag-green);color:#fff;border:none;border-radius:7px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .12s}
.act-btn{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.act-btn:hover{border-color:var(--border2);color:var(--text)}
.act-btn.del:hover{border-color:var(--tag-red);color:var(--tag-red);background:var(--tag-red-bg)}
.act-btn svg{transition:transform .2s ease}
.btn-accept:hover{opacity:.85}
.btn-accept:disabled{background:var(--muted2);cursor:not-allowed}
.btn-accepted{background:var(--tag-green-bg);color:var(--tag-green);border:1px solid var(--tag-green);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-accept-warn{background:var(--tag-yellow);color:#fff;border:none;border-radius:7px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}

/* ── HISTORY ── */
.history-row{background:var(--bg3)}
.history-inner{padding:8px 10px 10px 44px}
.history-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.history-item{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px}
.history-item:last-child{border-bottom:none}
.history-date{color:var(--muted);min-width:80px}
.history-amount{font-weight:600;color:var(--tag-green);min-width:70px}
.history-type{color:var(--muted);min-width:60px}
.history-period{color:var(--p);min-width:90px}
.history-comment{color:var(--muted2);font-style:italic;flex:1}
.history-del{background:none;border:none;cursor:pointer;color:var(--muted2);font-size:12px;padding:2px 4px;border-radius:4px;transition:all .12s}
.history-del:hover{color:var(--tag-red);background:var(--tag-red-bg)}
.no-history{color:var(--muted2);font-size:11px;font-style:italic}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:3px 6px}
.month-btn{background:none;border:none;cursor:pointer;font-size:1rem;color:var(--p);padding:0 2px;line-height:1}
.month-label{font-size:12px;font-weight:600;color:var(--black);min-width:100px;text-align:center}

/* ── ACTION BUTTONS ── */
.btn{padding:5px 12px;border:none;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--black);color:var(--bg)}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2)}
.btn-green{background:var(--tag-green);color:#fff}
.btn-green:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:11px}

/* ── TARIFF BADGE ── */
.plan-badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:600}
.plan-monthly{background:var(--tag-blue-bg);color:var(--tag-blue)}
.plan-sessions{background:var(--tag-green-bg);color:var(--tag-green)}
.plan-single{background:var(--tag-yellow-bg);color:var(--tag-yellow)}
.plan-days{background:#f3e5f5;color:#7b1fa2}
[data-theme="dark"] .plan-days{background:#2a1040;color:#c084fc}
.plan-free{background:var(--tag-gray-bg);color:var(--tag-gray)}

/* ── EMPTY / LOADING ── */
.empty-state{padding:32px;text-align:center;color:var(--muted2)}
.empty-icon{font-size:2.5rem;margin-bottom:8px}
.loading-state{padding:24px;text-align:center;color:var(--muted);font-size:12px}
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--border) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── TARIFF LIST ── */
.tariff-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg3);border-radius:8px;border:1px solid var(--border);margin-bottom:6px}
.tariff-item-name{font-size:12px;font-weight:500;color:var(--black)}
.tariff-item-details{font-size:11px;color:var(--muted);margin-top:2px}
.tariff-item-price{font-size:13px;font-weight:700;color:var(--p);margin:0 12px}
.tariff-actions{display:flex;gap:4px}

/* ── MODAL ── */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal.active{display:flex}
.modal-content{background:var(--bg);border:1px solid var(--border);border-radius:14px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:13px;font-weight:600;color:var(--black)}
.modal-close{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;transition:all .12s}
.modal-close:hover{border-color:var(--border2);color:var(--text)}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:4px}
.form-input,.form-select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;background:var(--input-bg);color:var(--text);outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus{border-color:var(--border2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;padding:8px 14px;background:var(--black);color:var(--bg);border-radius:8px;font-size:12px;font-weight:500;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--tag-red)}
.toast.success{background:var(--tag-green)}

/* ── MOBILE NAV ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--nav-bg);border-top:1px solid var(--border);z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mob-nav-items{display:flex;height:100%}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--muted);font-size:9px;font-weight:500;font-family:inherit;cursor:pointer;transition:color .15s;text-decoration:none}
.mob-nav-btn.active{color:var(--black)}

/* ── RESPONSIVE ── */
@media(max-width:1024px){.stats-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .sidebar-nav{display:none}
  .mob-nav{display:block}
  .main-area{padding:12px 10px 72px}
  .stats-strip{grid-template-columns:1fr 1fr}
  .pay-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="/" class="nav-logo">
    <svg width="23" height="23" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="1" width="18" height="18" rx="4.5" stroke="var(--black)" stroke-width="1.3"/>
      <path d="M5 15L13 7" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M8 7h5v5" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">InSkill<span>.online</span></span>
  </a>
  <div class="nav-right">
    <span class="nav-badge" id="nav-badge">ДИРЕКТОР</span>
    <div class="nav-divider"></div>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg id="icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <svg id="icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M13.5 10A6 6 0 015 2.5a6 6 0 108 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </div>
</nav>

<!-- OUTER LAYOUT -->
<div class="layout-outer">

<!-- LEFT NAV SIDEBAR -->
<aside class="sidebar-nav">
  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sideInitials">ДР</div>
    <div>
      <div class="sidebar-user-name" id="sideUserName">—</div>
      <div class="sidebar-user-id" id="sideUserId"></div>
    </div>
  </div>
  <div class="sidebar-section" id="lbl-side-section">Бухгалтерія</div>
  <a href="#" class="sitem active">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <span id="lbl-side-acc">Бухгалтерія</span>
  </a>
  <div class="sidebar-section" id="lbl-side-nav">Навігація</div>
  <a href="/director-dashboard.html" class="sitem" id="lbl-back-link">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L6 8l4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="lbl-back">Панель директора</span>
  </a>

  <div class="sidebar-section" style="display:flex;align-items:center;justify-content:space-between">
    <span id="lbl-groups-title">Групи</span>
    <span style="font-size:10px;color:var(--muted2)" id="groupCount"></span>
  </div>
  <div class="sidebar-groups-list" id="groupList">
    <div class="loading-state" style="padding:12px;font-size:11px">...</div>
  </div>
</aside>

<!-- CENTER -->
<div class="center">

<!-- MAIN AREA -->
<div class="main-area">

  <!-- STATS (director/accountant only) -->
  <div class="stats-strip" id="statsBar" style="display:none">
    <div class="stat-box">
      <div class="stat-value green" id="statCollected">—</div>
      <div class="stat-label" id="lbl-stat-collected">Зібрано за місяць</div>
    </div>

const API='https://primary-production-4b93e.up.railway.app/webhook/api';
const token=localStorage.getItem('token');
let user=null;
let currentGroupId=null;

let allGroups=[];

/* ── HELPERS ── */
function getLocale(){return currentLang==='en'?'en-GB':currentLang==='uk'?'uk-UA':'ru-RU';}
function formatDate(str){
  if(!str)return '—';
  return new Date(str).toLocaleDateString(getLocale(),{day:'2-digit',month:'2-digit',year:'numeric'});
}
function formatDateTime(str){
  if(!str)return '—';
  const d=new Date(str);
  return d.toLocaleDateString(getLocale(),{day:'2-digit',month:'2-digit'})+' '+
    d.toLocaleTimeString(getLocale(),{hour:'2-digit',minute:'2-digit'});
}
function formatMoney(n){
  const loc=currentLang==='en'?'en-US':'ru-RU';
  return Math.round(n).toLocaleString(loc)+' '+t('currency');
}
function getMonthName(m){return t('months')[m-1]||'';}

/* ── MONTH NAV ── */
function updateMonthLabel(){
  document.getElementById('monthLabel').textContent=getMonthName(currentMonth)+' '+currentYear;
}
function changeMonth(delta){
  currentMonth+=delta;
  if(currentMonth>12){currentMonth=1;currentYear++;}
  if(currentMonth<1){currentMonth=12;currentYear--;}
  updateMonthLabel();
  if(currentGroupId)loadGroupAthletes();
  if(user&&(user.role==='director'||user.role==='accountant'))loadStats();
}

/* ── INIT ── */
async function init(){
  user=JSON.parse(localStorage.getItem('user')||'{}');
  if(!user||!user.role){window.location.href='/';return;}
  const allowed=['director','accountant','trainer'];
  if(!allowed.includes(user.role)){window.location.href='/';return;}

  // Sidebar user info
  try{

  }catch(e){}

  // Nav badge by role
  const roleKey={director:'roleDir',accountant:'roleAcc',trainer:'roleTr'};
  document.getElementById('nav-badge').textContent=t(roleKey[user.role]||'navBadge');

  // Show tariffs button and stats only for director/accountant
  if(user.role==='director'||user.role==='accountant'){
    document.getElementById('statsBar').style.display='grid';
    document.getElementById('btnTariffs').style.display='';
  }

  // Back link for trainer
  if(user.role==='trainer'){

    if(bl)bl.href='/children-list.html';
  }

  applyLang();
  updateMonthLabel();

/* ── GROUPS ── */
async function loadGroups(){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'groups',action:'list'})});
    const d=await r.json();
    const allFromServer=Array.isArray(d)?d:(d.merged||[]);

    if(user.role==='trainer'||user.role==='accountant'){
      const ra=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token,resource:'group_accountants',action:'list',data:{user_id:user.id}})});
      const da=await ra.json();
      const accGroups=Array.isArray(da)?da:(da.merged||[]);
      const accGroupIds=accGroups.map(g=>g.group_id).filter(Boolean);
      allGroups=allFromServer.filter(g=>accGroupIds.includes(g.id));
    }else{
      allGroups=allFromServer;
    }

    document.getElementById('groupCount').textContent=allGroups.length;
    renderGroupList();
    if(user.role==='director'||user.role==='accountant')loadStats();
    // Автоматически открываем первую группу
    if(allGroups.length>0&&!currentGroupId)openGroup(allGroups[0].id);
  }catch(e){console.error(e);}
}

function renderGroupList(){
  const html=allGroups.length
    ?allGroups.map(g=>`
      <div class="group-item ${g.id===currentGroupId?'active':''}" onclick="openGroup(${g.id})">
        <div class="group-item-name">${g.name}</div>
        <div class="group-item-club">${g.club_name||'—'}</div>
      </div>`).join('')
    :`<div style="padding:12px;text-align:center;color:var(--muted2);font-size:11px">${t('noGroups')}</div>`;
  document.getElementById('groupList').innerHTML=html;
  // Мобильный overlay
  const mobList=document.getElementById('mobGroupList');
  if(mobList)mobList.innerHTML=html.replace(/onclick="openGroup\((\d+)\)"/g,'onclick="openGroup($1);hideMobGroups()"');
}

/* ── OPEN GROUP ── */
async function openGroup(groupId){
  currentGroupId=groupId;
  currentGroupData=allGroups.find(g=>g.id===groupId);
  renderGroupList();
  document.getElementById('mainEmpty').style.display='none';
  document.getElementById('mainContent').style.display='block';
  document.getElementById('groupTitle').textContent=currentGroupData?.name||'—';
  document.getElementById('groupSubtitle').textContent=currentGroupData?.club_name||'';
  await Promise.all([loadGroupAthletes(),loadGroupTariffs()]);
}

/* ── ATHLETES ── */
async function loadGroupAthletes(){
  document.getElementById('tableLoading').style.display='block';
  document.getElementById('accTable').style.display='none';
  document.getElementById('tableEmpty').style.display='none';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'children',action:'list'})});
    const d=await r.json();
    const all=Array.isArray(d)?d:(d.merged||[]);
    groupAthletes=all.filter(c=>{
      if(!c.group_names||c.group_names==='Без группы'||c.group_names==='Без групи')return false;
      return c.group_names.split(', ').includes(currentGroupData?.name);
    });

    const rp=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'payments',action:'list',
        data:{group_id:currentGroupId,month:currentMonth,year:currentYear}})});
    const dp=await rp.json();

    const rpAll=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'payments',action:'list',data:{group_id:currentGroupId}})});
    const dpAll=await rpAll.json();
    const allPayments=Array.isArray(dpAll)?dpAll:(dpAll.merged||[]);

    groupPayments={};
    allPayments.forEach(p=>{
      if(!p.child_id)return;
      if(!groupPayments[p.child_id])groupPayments[p.child_id]={history:[],last_type:'cash'};
      groupPayments[p.child_id].history.push(p);
      if(p.paid_until){
        if(!groupPayments[p.child_id].paid_until||p.paid_until>groupPayments[p.child_id].paid_until){
          groupPayments[p.child_id].paid_until=p.paid_until;
          groupPayments[p.child_id].last_type=p.payment_type||'cash';
        }
      }
    });

    document.getElementById('tableLoading').style.display='none';
    if(!groupAthletes.length){document.getElementById('tableEmpty').style.display='block';return;}
    document.getElementById('accTable').style.display='table';
    renderTable();
  }catch(e){
    console.error(e);
    document.getElementById('tableLoading').style.display='none';
  }
}

/* ── RENDER TABLE ── */
function renderTable(){
  const tbody=document.getElementById('accTableBody');
  const today=new Date();today.setHours(0,0,0,0);

  const lastPayMap={};
  Object.keys(groupPayments).forEach(cid=>{
    const pd=groupPayments[cid];
    if(!pd.history||!pd.history.length)return;
    const mStart=new Date(currentYear,currentMonth-1,1);
    const mEnd=new Date(currentYear,currentMonth,0,23,59,59);
    const monthPays=pd.history.filter(p=>{
      if(!p.child_id)return false;
      if(p.sessions_paid)return false;
      if(!p.paid_from)return false;
      const pf=new Date(p.paid_from);
      if(!p.paid_until)return pf>=mStart&&pf<=mEnd;
      return pf<=mEnd&&new Date(p.paid_until)>=mStart;
    }).sort((a,b)=>new Date(b.paid_at)-new Date(a.paid_at));
    const sessionPays=pd.history.filter(p=>p.child_id&&p.sessions_paid)
      .sort((a,b)=>new Date(b.paid_at)-new Date(a.paid_at));
    const sorted=monthPays.length?monthPays:sessionPays;
    if(!sorted.length)return;
    const last=sorted[0];
    const totalSessionsPaid=sorted.reduce((sum,p)=>sum+(parseInt(p.sessions_paid)||0),0);
    const sessionsUsed=parseInt(last.sessions_used)||0;
    const hasSessionsPay=sorted.some(p=>p.sessions_paid);
    lastPayMap[cid]={...last,
      sessions_paid:hasSessionsPay?totalSessionsPaid:null,
      sessions_used:hasSessionsPay?sessionsUsed:null};
  });

  const globalTariffId=document.getElementById('activeTariff')?.value;
  const nowMonthCheck=new Date().getMonth()+1;
  const nowYearCheck=new Date().getFullYear();
  const isPastMonth=(currentYear<nowYearCheck)||(currentYear===nowYearCheck&&currentMonth<nowMonthCheck);

  tbody.innerHTML=groupAthletes.map(athlete=>{
    const lastPay=lastPayMap[athlete.id];
    const lastType=lastPay?.payment_type||'cash';
    const lastTariffId=athlete._lastTariffId||globalTariffId||'';

    // STATUS & PERIOD
    let statusHtml='',periodHtml='';
    if(!lastPay){
      statusHtml=`<span class="status-badge status-none">${t('statusNone')}</span>`;
      periodHtml=`<span class="paid-until">—</span>`;
    }else if(lastPay.sessions_paid){
      const sessionsLeft=Math.max(0,lastPay.sessions_paid-(parseInt(lastPay.sessions_used)||0));
      if(sessionsLeft>0){
        statusHtml=`<span class="status-badge status-active">${t('statusSessions')}</span>`;
        periodHtml=`<span class="paid-until">${t('sessLeft')}<b>${sessionsLeft}</b>${t('sessOf')}${lastPay.sessions_paid}</span>`;
      }else{
        statusHtml=`<span class="status-badge status-overdue">${t('statusExpiredSess')}</span>`;
        periodHtml=`<span class="paid-until overdue">0${t('sessOf')}${lastPay.sessions_paid}</span>`;
      }
    }else if(lastPay.paid_until){
      const paidUntilDate=new Date(lastPay.paid_until);
      const monthStart=new Date(currentYear,currentMonth-1,1);
      const nowM=new Date().getMonth()+1;const nowY=new Date().getFullYear();
      const isPastM=(currentYear<nowY)||(currentYear===nowY&&currentMonth<nowM);
      if(paidUntilDate>=monthStart){
        if(isPastM){
          statusHtml=`<span class="status-badge status-active">${t('statusActive')}</span>`;
          periodHtml=`<span class="paid-until">${t('until')} ${formatDate(lastPay.paid_until)}</span>`;
        }else{
          const diffDays=Math.ceil((paidUntilDate-today)/(1000*60*60*24));
          const cls=diffDays>=0&&diffDays<=7?'soon':'';
          if(diffDays>=0){
            statusHtml=`<span class="status-badge status-active">${t('statusActive')}</span>`;
            periodHtml=`<span class="paid-until ${cls}">${t('until')} ${formatDate(lastPay.paid_until)}</span>`;
          }else{
            statusHtml=`<span class="status-badge status-overdue">${t('statusOverdue')}</span>`;
            periodHtml=`<span class="paid-until overdue">${t('until')} ${formatDate(lastPay.paid_until)}</span>`;
          }
        }
      }else{
        statusHtml=`<span class="status-badge status-overdue">${t('statusOverdue')}</span>`;
        periodHtml=`<span class="paid-until overdue">${t('until')} ${formatDate(lastPay.paid_until)}</span>`;
      }
    }else if(lastPay&&!lastPay.paid_until&&!lastPay.sessions_paid){
      statusHtml=`<span class="status-badge status-trial"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="6" width="14" height="9" rx="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M1 9h14M8 6v9" stroke="currentColor" stroke-width="1.2"/></svg> ${t('typeFree')}</span>`;
      periodHtml=`<span class="paid-until">${formatDate(lastPay.paid_from)}</span>`;
    }

    // ACCEPT BUTTON
    const today2=new Date();today2.setHours(0,0,0,0);
    const isMonthlyPaid=lastPay?.paid_until&&!lastPay.sessions_paid&&new Date(lastPay.paid_until)>=today2;
    const hasActiveSessions=lastPay?.sessions_paid&&(lastPay.sessions_paid-(parseInt(lastPay.sessions_used)||0))>0;
    let acceptBtn='';
    if(isMonthlyPaid){
      acceptBtn=`<button class="btn-accepted" onclick="confirmDoublePayment(${athlete.id})">${t('btnAccepted')}</button>`;
    }else if(hasActiveSessions){
      const left=lastPay.sessions_paid-(parseInt(lastPay.sessions_used)||0);
      acceptBtn=`<button class="btn-accept-warn" id="btn_${athlete.id}" onclick="acceptPayment(${athlete.id})" title="${left} sessions left">${t('btnWarn')}</button>`;
    }else{
      acceptBtn=`<button class="btn-accept" id="btn_${athlete.id}" onclick="acceptPayment(${athlete.id})">${t('btnAccept')}</button>`;
    }

    // PHOTO
    const photo=athlete.photo_url
      ?`<img class="athlete-photo" src="${athlete.photo_url}" loading="lazy">`
      :`<div class="athlete-photo-placeholder">${(athlete.first_name||'')[0]}${(athlete.last_name||'')[0]}</div>`;

    // TYPE OPTIONS
    const typeMap={cash:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="4" width="14" height="8" rx="1.2" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/></svg> '+t('cash'),card:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 6.5h14" stroke="currentColor" stroke-width="1.2"/><path d="M4 9.5h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg> '+t('card'),bank:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M1 6h14M3 6V13M7 6V13M9 6V13M13 6V13M2 13h12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M1 6L8 1l7 5" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg> '+t('bank')};
    const typeOptions=Object.entries(typeMap).map(([v,lbl])=>
      `<option value="${v}" ${v===lastType?'selected':''}>${lbl}</option>`).join('');

    // TARIFF SELECT
    const allowedTariffs=isPastMonth?groupTariffs.filter(t=>t.plan_type==='monthly'||t.plan_type==='free'):groupTariffs;
    const rowTariffObj=lastTariffId?groupTariffs.find(t=>t.id==lastTariffId):null;
    const isDays=rowTariffObj?.plan_type==='days';
    const defaultFrom=new Date().toISOString().split('T')[0];
    const tariffIcons={monthly:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 6h14" stroke="currentColor" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',days:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 6h14" stroke="currentColor" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M5 9.5l2 2 4-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',sessions:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r=".8" fill="currentColor"/></svg>',free:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="6" width="14" height="9" rx="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M1 9h14M8 6v9" stroke="currentColor" stroke-width="1.2"/><path d="M8 6C8 4 6 2 5 2c-1 0-1.5 1-1 2s4 2 4 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 6c0-2 2-4 3-4 1 0 1.5 1 1 2s-4 2-4 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',single:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M5.5 7.5L8 5l2.5 2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
    const rowTariffSel=`<div style="display:flex;align-items:center;gap:3px">
      <select class="pay-type-select" id="tariff_${athlete.id}" onchange="onRowTariffChange(${athlete.id})" style="max-width:130px;font-size:11px">
        ${allowedTariffs.map(t=>`<option value="${t.id}" ${t.id==lastTariffId?'selected':''}>${tariffIcons[t.plan_type]||''} ${t.name}</option>`).join('')}
        <option value="" ${!lastTariffId?'selected':''}>—</option>
      </select>
      <div id="datebtn_wrap_${athlete.id}" style="display:${isDays?'flex':'none'};align-items:center;gap:2px">
        <button class="act-btn" onclick="toggleDatePicker(${athlete.id})" style="width:24px;height:24px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 6h14" stroke="currentColor" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <input type="date" id="paid_from_${athlete.id}" value="${defaultFrom}"
          lang="${currentLang==='en'?'en-GB':currentLang==='uk'?'uk-UA':'ru-RU'}"
          onchange="onPaidFromChange(${athlete.id})"
          style="display:none;padding:3px 5px;border:1px solid var(--p);border-radius:5px;font-size:11px;width:110px;background:var(--input-bg);color:var(--text)">
      </div>
    </div>`;

    return `<tr id="row_${athlete.id}">
      <td><button class="act-btn" onclick="toggleHistory(${athlete.id})" style="width:24px;height:24px"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></td>
      <td><div class="athlete-info">${photo}<div><div class="athlete-name">${athlete.last_name} ${athlete.first_name}</div></div></div></td>
      <td>${statusHtml}</td>
      <td>${periodHtml}</td>
      <td>${rowTariffSel}</td>
      <td>
        <div class="pay-row">
          <button class="sessions-btn" onclick="addSessions(${athlete.id},-1)">−</button>
          <input class="amount-input" type="number" id="amount_${athlete.id}" value="" min="0" placeholder="0" oninput="onAmountInput(${athlete.id})" style="width:65px">
          <button class="sessions-btn" onclick="addSessions(${athlete.id},1)">+</button>
        </div>
      </td>
      <td><select class="pay-type-select" id="type_${athlete.id}">${typeOptions}</select></td>
      <input type="hidden" id="comment_${athlete.id}" value="">
      <td>${acceptBtn}</td>
    </tr>
    <tr id="history_${athlete.id}" class="history-row" style="display:none">
      <td colspan="9">
        <div class="history-inner">
          <div class="history-title">${t('historyTitle')}</div>
          ${renderHistory(athlete.id)}
        </div>
      </td>
    </tr>`;
  }).join('');

function onRowTariffChange(childId){
  const tariffId=document.getElementById(`tariff_${childId}`)?.value;
  const athlete=groupAthletes.find(a=>a.id===childId);
  if(athlete)athlete._lastTariffId=tariffId;
  const tariff=tariffId?groupTariffs.find(t=>t.id==tariffId):null;
  const wrap=document.getElementById(`datebtn_wrap_${childId}`);
  if(wrap)wrap.style.display=tariff?.plan_type==='days'?'flex':'none';
  const dp=document.getElementById(`paid_from_${childId}`);
  if(dp)dp.style.display='none';
  const inp=document.getElementById(`amount_${childId}`);
  if(inp){inp.value='';inp.classList.remove('filled');}
}

function toggleDatePicker(childId){
  const dp=document.getElementById(`paid_from_${childId}`);
  if(!dp)return;
  dp.style.display=dp.style.display==='none'?'block':'none';
  if(dp.style.display!=='none')dp.focus();
}

function onPaidFromChange(childId){
  const dp=document.getElementById(`paid_from_${childId}`);
  if(dp)dp.style.display='none';
}

function toggleHistory(childId){
  const row=document.getElementById(`history_${childId}`);
  const btn=document.querySelector(`#row_${childId} .act-btn`);
  const isOpen=row.style.display!=='none';
  row.style.display=isOpen?'none':'table-row';
  if(btn)btn.style.transform=isOpen?'':'rotate(180deg)';
}

/* ── TRANSLATE PERIOD LABEL (из БД на текущий язык) ── */
function translatePeriodLabel(label){
  if(!label||label==='—')return label;

  // Льгота / Пільга / Free → periodFree
  const freeWords=['льгота','пільга','free','бесплатно','безкоштовно'];
  if(freeWords.includes(label.toLowerCase()))return t('periodFree');

  // 1 тренировка / 1 тренування / 1 session → periodSingle
  const singleWords=['1 тренировка','1 тренування','1 session'];
  if(singleWords.includes(label.toLowerCase()))return t('periodSingle');

  // "N дней" / "N днів" / "N days" → periodDays
  const daysMatch=label.match(/^(\d+)\s*(дн|days|день)/i);
  if(daysMatch)return t('periodDays').replace('{n}',daysMatch[1]);

  // "N тренировок" / "N тренувань" / "N sessions" → periodSessions
  const sessMatch=label.match(/^(\d+)\s*(трен|sessions|session)/i);
  if(sessMatch)return t('periodSessions').replace('{n}',sessMatch[1]);

  // "Месяц Год" или "Month Year" — любой из известных месяцев
  const allMonths=[
    ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'],
    ['січень','лютий','березень','квітень','травень','червень','липень','серпень','вересень','жовтень','листопад','грудень'],
    ['january','february','march','april','may','june','july','august','september','october','november','december'],
    // родительный падеж ru
    ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']
  ];
  const parts=label.trim().split(/\s+/);
  if(parts.length===2){
    const word=parts[0].toLowerCase();
    const year=parseInt(parts[1]);
    if(!isNaN(year)&&year>2000&&year<2100){
      for(let i=0;i<allMonths.length;i++){
        const idx=allMonths[i].indexOf(word);
        if(idx!==-1){
          const monthName=t('months')[idx]||parts[0];
          return t('periodMonth').replace('{m}',monthName).replace('{y}',year);
        }
      }
    }
  }

  // Не распознано — возвращаем как есть
  return label;
}

function getSinglePrice(childId){
  const rowSel=childId?document.getElementById(`tariff_${childId}`):null;
  const tariffId=rowSel?.value||document.getElementById('activeTariff')?.value;
  if(!tariffId)return 0;
  const t=groupTariffs.find(t=>t.id==tariffId);
  if(!t)return 0;
  if(t.plan_type==='monthly'||t.plan_type==='days'||t.plan_type==='single')return t.price;
  if(t.plan_type==='free')return 0;
  if(t.plan_type==='sessions'&&t.sessions_limit)return Math.round(t.price/t.sessions_limit);
  return t.price;
}

function addSessions(childId,delta){
  const inp=document.getElementById(`amount_${childId}`);
  const singlePrice=getSinglePrice(childId);
  if(!singlePrice){showToast(t('fillRequired'),'error');return;}
  const current=parseFloat(inp.value)||0;
  inp.value=Math.max(0,current+delta*singlePrice)||'';
  onAmountInput(childId);
}

function onAmountInput(childId){
  const inp=document.getElementById(`amount_${childId}`);
  inp.classList.toggle('filled',!!inp.value);
}

function fillByTariff(){
  const sel=document.getElementById('activeTariff');
  if(!sel.value){showToast(t('fillRequired'),'error');return;}
  const tariff=groupTariffs.find(t=>t.id==sel.value);
  if(!tariff)return;
  groupAthletes.forEach(a=>{
    const lastPay=Object.values(groupPayments[a.id]?.history||[])
      .sort((x,y)=>new Date(y.paid_at)-new Date(x.paid_at))[0];
    const endOfMonth=new Date(currentYear,currentMonth,0);
    if(lastPay?.paid_until&&!lastPay.sessions_paid&&new Date(lastPay.paid_until)>=endOfMonth)return;
    const tariffSel=document.getElementById(`tariff_${a.id}`);
    if(tariffSel)tariffSel.value=tariff.id;
    const inp=document.getElementById(`amount_${a.id}`);
    if(inp){inp.value=tariff.price;inp.classList.add('filled');}
    a._lastTariffId=tariff.id;
  });
}

/* ── ACCEPT PAYMENT ── */
async function acceptPayment(childId){
  const amount=parseFloat(document.getElementById(`amount_${childId}`)?.value)||0;
  const rowTariffIdCheck=document.getElementById(`tariff_${childId}`)?.value;
  const tariffCheck=rowTariffIdCheck?groupTariffs.find(t=>t.id==rowTariffIdCheck):null;
  const isFree=tariffCheck?.plan_type==='free';
  if(!isFree&&amount<=0){showToast(t('acceptRequired'),'error');return;}
  const payType=document.getElementById(`type_${childId}`)?.value||'cash';
  const comment=document.getElementById(`comment_${childId}`)?.value||'';
  const btn=document.getElementById(`btn_${childId}`);
  const rowTariffId=document.getElementById(`tariff_${childId}`)?.value;
  const tariff=rowTariffId?groupTariffs.find(t=>t.id==rowTariffId):null;
  const lastPayData=Object.values(groupPayments[childId]?.history||[])
    .filter(p=>p.paid_until&&!p.sessions_paid)
    .sort((a,b)=>new Date(b.paid_until)-new Date(a.paid_until))[0];
  const currentPaidUntil=lastPayData?.paid_until||null;
  const paidFrom=calcPaidFrom(tariff,childId);
  const paidUntil=calcPaidUntil(tariff,currentPaidUntil,paidFrom);
  let sessionsPaid=null;
  if(tariff?.plan_type==='sessions'&&tariff.sessions_limit&&tariff.price){
    const pricePerSession=Math.round(tariff.price/tariff.sessions_limit);
    sessionsPaid=pricePerSession>0?Math.round(amount/pricePerSession):tariff.sessions_limit;
  }
  const periodLabel=buildPeriodLabel(tariff,sessionsPaid);
  const clubId=currentGroupData?.club_id;
  if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'payments',action:'create',data:{
        child_id:childId,club_id:clubId,amount,payment_type:payType,
        paid_from:paidFrom,paid_until:paidUntil,period_label:periodLabel,
        sessions_paid:sessionsPaid,comment}})});
    const inp=document.getElementById(`amount_${childId}`);
    if(inp){inp.value='';inp.classList.remove('filled');}
    const commInp=document.getElementById(`comment_${childId}`);
    if(commInp)commInp.value='';
    if(btn){btn.textContent=t('accepted');btn.style.background='var(--tag-green)';}
    setTimeout(async()=>{
      await loadGroupAthletes();
      if(user.role==='director'||user.role==='accountant')await loadStats();
    },800);
  }catch(e){
    console.error(e);
    if(btn){btn.disabled=false;btn.textContent=t('btnAccept');}
    showToast(t('saveErr'),'error');
  }
}

async function acceptAll(){
  const toAccept=groupAthletes.filter(a=>{
    const tariffId=document.getElementById(`tariff_${a.id}`)?.value;
    const tObj=tariffId?groupTariffs.find(t=>t.id==tariffId):null;

/* ── CALC HELPERS (полностью из MVP) ── */
function calcPaidFrom(tariff,childId){
  if(!tariff)return null;
  if(tariff.plan_type==='days'&&childId){
    const lastPayData=Object.values(groupPayments[childId]?.history||[])
      .filter(p=>p.paid_until&&!p.sessions_paid)
      .sort((a,b)=>new Date(b.paid_until)-new Date(a.paid_until))[0];
    const today=new Date();today.setHours(0,0,0,0);
    if(lastPayData?.paid_until&&new Date(lastPayData.paid_until)>today){
      const next=new Date(new Date(lastPayData.paid_until).getTime()+86400000);
      return `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
    }
    const dp=document.getElementById(`paid_from_${childId}`);
    if(dp?.value)return dp.value;
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  return `${currentYear}-${String(currentMonth).padStart(2,'0')}-01`;
}

function calcPaidUntil(tariff,currentPaidUntil,currentPaidFrom){
  if(!tariff)return null;
  if(tariff.plan_type==='free')return null;
  const today=new Date();today.setHours(0,0,0,0);
  const nowMonth=new Date().getMonth()+1;
  const nowYear=new Date().getFullYear();
  const isPast=(currentYear<nowYear)||(currentYear===nowYear&&currentMonth<nowMonth);
  if(isPast){
    const d=new Date(currentYear,currentMonth,0);
    return d.toISOString().split('T')[0];
  }
  const base=(currentPaidUntil&&new Date(currentPaidUntil)>today)?new Date(currentPaidUntil):today;
  if(tariff.plan_type==='monthly'){
    const d=new Date(currentYear,currentMonth,0);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  if(tariff.plan_type==='sessions')return null;
  if(tariff.plan_type==='days'&&tariff.duration_days){
    let startDate;
    if(currentPaidUntil&&new Date(currentPaidUntil)>today){
      startDate=new Date(new Date(currentPaidUntil).getTime()+86400000);
    }else{
      startDate=currentPaidFrom?new Date(currentPaidFrom):today;
    }
    const d=new Date(startDate.getTime()+tariff.duration_days*86400000);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  if(tariff.plan_type==='single')return today.toISOString().split('T')[0];
  if(tariff.duration_days){
    const d=new Date(base.getTime()+tariff.duration_days*86400000);
    return d.toISOString().split('T')[0];
  }
  return null;
}

function buildPeriodLabel(tariff,sessionsPaid){
  const months=t('months');
  if(!tariff)return`${months[currentMonth-1]} ${currentYear}`;
  if(tariff.plan_type==='monthly')return t('periodMonth').replace('{m}',months[currentMonth-1]).replace('{y}',currentYear);
  if(tariff.plan_type==='days')return t('periodDays').replace('{n}',tariff.duration_days||'?');
  if(tariff.plan_type==='sessions')return t('periodSessions').replace('{n}',sessionsPaid||tariff.sessions_limit);
  if(tariff.plan_type==='single')return t('periodSingle');
  if(tariff.plan_type==='free')return t('periodFree');
  return`${months[currentMonth-1]} ${currentYear}`;
}

/* ── STATS ── */
async function loadStats(){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'payments',action:'list',data:{}})});
    const d=await r.json();
    const allPayments=(Array.isArray(d)?d:(d.merged||[])).filter(p=>p.status!=='deleted'&&p.child_id);
    const mStart=new Date(currentYear,currentMonth-1,1);
    const mEnd=new Date(currentYear,currentMonth,0,23,59,59);
    let collected=0;
    allPayments.forEach(p=>{
      if(!p.amount)return;
      const amount=parseFloat(p.amount);
      if(!p.paid_from||!p.paid_until){
        const pa=new Date(p.paid_at);
        if(pa>=mStart&&pa<=mEnd)collected+=amount;
        return;
      }
      const pf=new Date(p.paid_from),pu=new Date(p.paid_until);
      const overlapStart=Math.max(pf.getTime(),mStart.getTime());
      const overlapEnd=Math.min(pu.getTime(),mEnd.getTime());
      if(overlapEnd<overlapStart)return;
      const totalDays=Math.round((pu-pf)/86400000)+1;
      const overlapDays=Math.round((overlapEnd-overlapStart)/86400000)+1;
      collected+=Math.round(amount*overlapDays/totalDays);
    });
    document.getElementById('statCollected').textContent=formatMoney(collected);
    const activeMap={};
    allPayments.forEach(p=>{
      if(!p.paid_from)return;
      const pf=new Date(p.paid_from);
      if(!p.paid_until&&p.period_label===t('periodFree')){
        if(pf>=mStart&&pf<=mEnd)activeMap[p.child_id]=true;return;
      }
      if(!p.paid_until)return;
      const pu=new Date(p.paid_until);
      if(pf<=mEnd&&pu>=mStart)activeMap[p.child_id]=true;
    });
    const rc=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'children',action:'list'})});
    const dc=await rc.json();
    const children=Array.isArray(dc)?dc:(dc.merged||[]);
    let debtors=0,active=0;
    children.forEach(c=>{if(activeMap[c.id])active++;else debtors++;});
    document.getElementById('statDebt').textContent='—';
    document.getElementById('statDebtors').textContent=debtors;
    document.getElementById('statActive').textContent=active;
  }catch(e){console.error(e);}
}

  document.getElementById('tariffSessionsWrap').style.display=type==='sessions'?'block':'none';
  const priceInp=document.getElementById('tariffPrice');
  if(type==='free'){priceInp.value='0';priceInp.readOnly=true;}
  else{priceInp.readOnly=false;}
  const durLabel=document.getElementById('lbl-tariff-duration');
  if(durLabel)durLabel.textContent=type==='days'?t('lblTariffDurationDays'):t('lblTariffDuration');
}

function closeTariffForm(){
  document.getElementById('tariffForm').style.display='none';
}

async function saveTariff(){
  const name=document.getElementById('tariffName').value.trim();
  const price=parseFloat(document.getElementById('tariffPrice').value);
  const planType=document.getElementById('tariffType').value;
  const duration=parseInt(document.getElementById('tariffDuration').value)||null;
  const sessions=parseInt(document.getElementById('tariffSessions').value)||null;
  const editId=document.getElementById('tariffEditId').value;
  if(!name||price===null||isNaN(price)){showToast(t('fillPriceRequired'),'error');return;}
  if(!currentGroupData?.club_id){showToast(t('noClub'),'error');return;}
  const data={name,plan_type:planType,price,club_id:currentGroupData.club_id,
    duration_days:(planType==='monthly'||planType==='days')?(duration||30):null,
    sessions_limit:planType==='sessions'?sessions:null};
  if(editId)data.id=parseInt(editId);
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'payment_plans',action:editId?'update':'create',data})});
    closeTariffForm();
    showToast(t('tariffSaved'));
    await loadGroupTariffs();
    renderTariffsList();
  }catch(e){console.error(e);showToast(t('saveErr'),'error');}
}

async function deleteTariff(id){
  if(!confirm(t('confirmDeleteTariff')))return;
  try{
    await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'payment_plans',action:'delete',data:{id}})});
    await loadGroupTariffs();renderTariffsList();
  }catch(e){console.error(e);}
}

init();
</script>
</body>
</html>
