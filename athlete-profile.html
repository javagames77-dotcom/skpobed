<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Профиль спортсмена - InSkill</title>
<style>
:root{--p:#0066CC;--s:#FF9933;--d:#1a1a1a;--l:#f8f9fa;--b:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:var(--l);color:var(--d)}
.header{background:#fff;border-bottom:3px solid var(--p);padding:1rem 2rem}
.btn-back{padding:0.5rem 1rem;background:var(--p);color:#fff;border:none;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
.container{max-width:1200px;margin:2rem auto;padding:0 2rem}
.profile-card{background:#fff;padding:2rem;border-radius:12px;margin-bottom:2rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.profile-header{display:flex;gap:2rem;align-items:start}
.profile-photo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--p)}
.profile-info h1{font-size:2rem;color:var(--p);margin-bottom:0.5rem}
.profile-info p{color:#666;margin-bottom:0.25rem}
.section{background:#fff;padding:2rem;border-radius:12px;margin-bottom:2rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.section-title{font-size:1.5rem;color:var(--p);margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:2px solid var(--b)}
.group-badge{display:inline-block;padding:0.5rem 1rem;background:#e3f2fd;color:var(--p);border-radius:20px;font-size:0.9rem;font-weight:600;margin:0.25rem}
.btn-edit{padding:0.75rem 1.5rem;background:var(--s);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:#fff;border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:2rem}
.modal-title{font-size:1.5rem;color:var(--p);margin-bottom:1.5rem}
.form-group{margin-bottom:1rem}
.form-label{display:block;margin-bottom:0.5rem;font-weight:600;color:#555}
.form-input{width:100%;padding:0.75rem;border:2px solid var(--b);border-radius:8px}
.group-checkbox{display:block;padding:0.75rem;border:1px solid var(--b);border-radius:8px;margin-bottom:0.5rem;cursor:pointer;transition:all 0.2s}
.group-checkbox:hover{background:var(--l)}
.group-checkbox input{margin-right:0.5rem}
.btn-row{display:flex;gap:1rem;margin-top:1.5rem}
.btn{padding:0.75rem 1.5rem;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-cancel{background:var(--l);color:var(--d)}
.btn-save{background:var(--s);color:#fff}
</style>
</head>
<body>
<div class="header">
<a href="javascript:history.back()" class="btn-back">← Назад</a>
</div>

<div class="container">
<div class="profile-card">
<div class="profile-header">
<img id="athletePhoto" src="https://via.placeholder.com/150" class="profile-photo">
<div class="profile-info">
<h1 id="athleteName">—</h1>
<p>🎂 <span id="athleteBirthDate">—</span></p>
<p>👤 <span id="athleteParent">—</span></p>
</div>
</div>
</div>

<div class="section">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
<h2 class="section-title" style="margin:0;border:none">Информация</h2>
<button class="btn-edit" onclick="openEditModal()">Редактировать</button>
</div>
<div id="groupsList"></div>
</div>
</div>

<div class="modal" id="editModal">
<div class="modal-content">
<h2 class="modal-title">Редактировать спортсмена</h2>
<form onsubmit="saveAthlete(event)">
<div class="form-group">
<label class="form-label">Имя *</label>
<input type="text" id="editFirstName" class="form-input" required>
</div>
<div class="form-group">
<label class="form-label">Фамилия *</label>
<input type="text" id="editLastName" class="form-input" required>
</div>
<div class="form-group">
<label class="form-label">Дата рождения</label>
<div style="display:flex;gap:0.5rem">
<select id="editBirthDay" class="form-input" style="flex:1">
<option value="">День</option>
</select>
<select id="editBirthMonth" class="form-input" style="flex:1">
<option value="">Месяц</option>
</select>
<select id="editBirthYear" class="form-input" style="flex:1">
<option value="">Год</option>
</select>
</div>
</div>
<div class="form-group">
<label class="form-label">Группы *</label>
<div id="editGroupsCheckboxes"></div>
</div>
<div class="btn-row">
<button type="button" class="btn btn-cancel" onclick="closeEditModal()">Отмена</button>
<button type="submit" class="btn btn-save">Сохранить</button>
</div>
</form>
</div>
</div>

<script>
const API='https://primary-production-4b93e.up.railway.app/webhook/api';
const token=localStorage.getItem('token');
const athleteId=new URLSearchParams(location.search).get('id');
let athlete=null,allGroups=[],athleteGroupIds=[];

if(!token||!athleteId){location.href='/';throw new Error('No auth');}

async function loadAthlete(){
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'list'})});
const d=await r.json();
const children=d.merged||d||[];
athlete=children.find(c=>c.id==athleteId);
if(!athlete){alert('Спортсмен не найден');history.back();return;}

document.getElementById('athleteName').textContent=`${athlete.first_name} ${athlete.last_name}`;
const birthDate=athlete.birth_date?new Date(athlete.birth_date).toLocaleDateString('ru-RU'):'—';
document.getElementById('athleteBirthDate').textContent=birthDate;
document.getElementById('athleteParent').textContent=athlete.parent_email||'—';
if(athlete.photo_url)document.getElementById('athletePhoto').src=athlete.photo_url;

const groupNames=athlete.group_names&&athlete.group_names!=='Без группы'?athlete.group_names.split(', '):[];
document.getElementById('groupsList').innerHTML=groupNames.length>0?groupNames.map(g=>`<span class="group-badge">${g}</span>`).join(''):'<p style="color:#999">Нет групп</p>';

await loadGroups();
}catch(e){console.error(e);alert('Ошибка загрузки')}
}

async function loadGroups(){
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'groups',action:'list'})});
const d=await r.json();
allGroups=d.merged||d||[];

const r2=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'list'})});
const d2=await r2.json();
const children=d2.merged||d2||[];
const child=children.find(c=>c.id==athleteId);

athleteGroupIds=[];
if(child&&child.group_names&&child.group_names!=='Без группы'){
const groupNames=child.group_names.split(', ');
athleteGroupIds=allGroups.filter(g=>groupNames.includes(g.name)).map(g=>g.id);
}
}catch(e){console.error(e)}
}

function openEditModal(){
// Populate birth date selects
const daySelect=document.getElementById('editBirthDay');
const monthSelect=document.getElementById('editBirthMonth');
const yearSelect=document.getElementById('editBirthYear');

daySelect.innerHTML='<option value="">День</option>'+Array.from({length:31},(_, i)=>`<option value="${i+1}">${i+1}</option>`).join('');
monthSelect.innerHTML='<option value="">Месяц</option>'+['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'].map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
yearSelect.innerHTML='<option value="">Год</option>'+Array.from({length:50},(_, i)=>`<option value="${new Date().getFullYear()-i}">${new Date().getFullYear()-i}</option>`).join('');

// Fill current values
document.getElementById('editFirstName').value=athlete.first_name||'';
document.getElementById('editLastName').value=athlete.last_name||'';

if(athlete.birth_date){
const bd=new Date(athlete.birth_date);
daySelect.value=bd.getDate();
monthSelect.value=bd.getMonth()+1;
yearSelect.value=bd.getFullYear();
}

// Groups checkboxes
const html=allGroups.map(g=>`
<label class="group-checkbox">
<input type="checkbox" value="${g.id}" ${athleteGroupIds.includes(g.id)?'checked':''}>
${g.name} <span style="color:#666">(${g.club_name||'—'})</span>
</label>
`).join('');
document.getElementById('editGroupsCheckboxes').innerHTML=html||'<p style="color:#999">Нет доступных групп</p>';

document.getElementById('editModal').classList.add('active');
document.body.style.overflow='hidden';
}

function closeEditModal(){
document.getElementById('editModal').classList.remove('active');
document.body.style.overflow='auto';
}

async function saveAthlete(event){
event.preventDefault();

const fn=document.getElementById('editFirstName').value.trim();
const ln=document.getElementById('editLastName').value.trim();
const d=document.getElementById('editBirthDay').value;
const m=document.getElementById('editBirthMonth').value;
const y=document.getElementById('editBirthYear').value;
const selectedGroups=Array.from(document.querySelectorAll('#editGroupsCheckboxes input:checked')).map(cb=>parseInt(cb.value));

if(!fn||!ln){alert('Заполните имя и фамилию');return;}
if(selectedGroups.length===0){alert('Выберите хотя бы одну группу');return;}

const data={id:parseInt(athleteId),first_name:fn,last_name:ln};
if(d&&m&&y)data.birth_date=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;

try{
// Update basic info
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'update',data})});
let res=await r.json();
const result=(res.merged&&res.merged[0])||(Array.isArray(res)?res[0]:res);

if(result&&result.id){
// Get face token
const r3=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'face_tokens',action:'list',data:{child_id:parseInt(athleteId)}})});
const d3=await r3.json();
const faceTokensData=(d3.merged||d3||[]).filter(ft=>ft.child_id==parseInt(athleteId));
const childFaceToken=faceTokensData.length>0?faceTokensData[0].face_token:null;

const removedGroups=[];
const addedGroups=[];

// Determine changes
for(let gid of athleteGroupIds){
if(!selectedGroups.includes(gid)){
removedGroups.push(gid);
}
}

for(let gid of selectedGroups){
if(!athleteGroupIds.includes(gid)){
addedGroups.push(gid);
}
}

// Sync Face++ FIRST
if(childFaceToken && (removedGroups.length > 0 || addedGroups.length > 0)){
await fetch('https://primary-production-4b93e.up.railway.app/webhook/sync-child-facesets', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({
token,
child_id: parseInt(athleteId),
action: 'update',
removed_groups: removedGroups,
added_groups: addedGroups
})
});
}

// THEN update DB
for(let gid of removedGroups){
await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children_groups',action:'remove',data:{child_id:parseInt(athleteId),group_id:gid}})});
}

for(let gid of addedGroups){
await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children_groups',action:'assign',data:{child_id:parseInt(athleteId),group_id:gid}})});
}

closeEditModal();
alert('Сохранено!');
await loadAthlete();
}else{
alert('Ошибка: '+(result?.error||JSON.stringify(res)));
}
}catch(err){
console.error(err);
alert('Ошибка: '+err.message);
}
}

loadAthlete();
</script>
</body>
</html>
