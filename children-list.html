<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InSkill Online</title>
<style>
:root{--p:#0066CC;--s:#FF9933;--d:#1a1a1a;--l:#f8f9fa;--b:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:var(--l);color:var(--d)}
.header{background:#fff;border-bottom:3px solid var(--p);padding:1rem 2rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.header-content{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:.75rem;font-size:1.5rem;font-weight:700;color:var(--p);text-decoration:none}
.logo-icon{width:40px;height:40px;background:var(--p);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-bars{display:flex;gap:3px;align-items:flex-end}
.logo-bar{width:6px;background:#fff;border-radius:2px}
.logo-bar:nth-child(1){height:12px}
.logo-bar:nth-child(2){height:18px;background:var(--s)}
.logo-bar:nth-child(3){height:24px;background:var(--s)}
.btn-logout{padding:.5rem 1rem;background:#fff;border:1px solid var(--b);border-radius:6px;cursor:pointer;font-size:.9rem}
.container{max-width:1400px;margin:2rem auto;padding:0 2rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid var(--b)}
.tab{padding:1rem 2rem;background:transparent;border:none;border-bottom:3px solid transparent;cursor:pointer;font-size:1rem;font-weight:600;color:#666}
.tab.active{color:var(--p);border-bottom-color:var(--p)}
.tab-content{display:none}
.tab-content.active{display:block}
.page-header{background:#fff;padding:1.5rem;border-radius:12px;margin-bottom:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center}
.page-title{font-size:1.75rem;font-weight:700;color:var(--p)}
.filters{background:#fff;padding:1.5rem;border-radius:12px;margin-bottom:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end}
.filter-group{flex:1;min-width:200px}
.filter-label{display:block;margin-bottom:.5rem;font-size:.85rem;font-weight:600;color:#555;text-transform:uppercase}
.filter-input,.filter-select{width:100%;padding:.75rem;border:2px solid var(--b);border-radius:8px;font-size:1rem}
.btn-add{padding:.75rem 1.5rem;background:var(--s);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.table-container{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
.table{width:100%;border-collapse:collapse}
.table thead{background:linear-gradient(135deg,var(--p),#0052a3);color:#fff}
.table th{padding:1rem;text-align:left;font-weight:600;text-transform:uppercase;font-size:.85rem}
.table td{padding:1rem;border-bottom:1px solid var(--b)}
.child-photo{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--b)}
.group-badge{display:inline-block;padding:.35rem .75rem;background:#e3f2fd;color:var(--p);border-radius:20px;font-size:.85rem;font-weight:500}
.table-actions{display:flex;gap:.5rem}
.btn-icon{width:36px;height:36px;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.btn-edit{background:#e3f2fd;color:var(--p)}
.btn-delete{background:#ffebee;color:#dc3545}
.loading{text-align:center;padding:3rem;color:var(--p)}
.empty-state{text-align:center;padding:4rem 2rem;color:#999}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.modal.active{display:flex}
.modal-content{background:#fff;border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:1.5rem;border-bottom:2px solid var(--b);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:1.5rem;font-weight:700;color:var(--p)}
.modal-close{width:32px;height:32px;border:none;background:var(--l);border-radius:50%;cursor:pointer;font-size:1.2rem}
.modal-body{padding:1.5rem}
.form-group{margin-bottom:1.25rem}
.form-label{display:block;margin-bottom:.5rem;font-weight:600;color:#555;font-size:.9rem}
.form-input,.form-select{width:100%;padding:.75rem;border:2px solid var(--b);border-radius:8px;font-size:1rem}
.date-inputs{display:flex;gap:.75rem}
.date-inputs .form-group{flex:1;margin-bottom:0}
.modal-footer{padding:1.5rem;border-top:2px solid var(--b);display:flex;gap:1rem;justify-content:flex-end}
.btn{padding:.75rem 1.5rem;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem}
.btn-cancel{background:var(--l);color:var(--d)}
.btn-save{background:var(--s);color:#fff}
@media (max-width:768px){
.container{padding:0 1rem}
.tabs{overflow-x:auto}
.page-header{flex-direction:column;gap:1rem;align-items:flex-start}
.filters{flex-direction:column}
.filter-group{width:100%}
.btn-add{width:100%;justify-content:center}
.table thead{display:none}
.table,.table tbody,.table tr,.table td{display:block}
.table tr{background:#fff;margin-bottom:1rem;border-radius:12px;padding:1rem}
.table td{border:none;padding:.5rem 0;display:flex;justify-content:space-between}
.table td:before{content:attr(data-label);font-weight:600;color:#666;font-size:.85rem}
.table td:first-child{justify-content:center;padding-bottom:1rem;border-bottom:1px solid var(--b)}
.table td:first-child:before{display:none}
.date-inputs{flex-direction:column}
}
</style>
</head>
<body>

<header class="header">
<div class="header-content">
<a href="/" class="logo">
<div class="logo-icon"><div class="logo-bars"><div class="logo-bar"></div><div class="logo-bar"></div><div class="logo-bar"></div></div></div>
<span>InSkill<span style="color:var(--s)">.online</span></span>
</a>
<div style="display:flex;align-items:center;gap:1rem">
<span id="userName">—</span>
<button class="btn-logout" onclick="logout()">Выход</button>
</div>
</div>
</header>

<div class="container">
<div class="tabs">
<button class="tab active" onclick="switchTab('children')">👶 Спортсмены</button>
</div>

<div class="tab-content active" id="tab-children">
<div class="page-header">
<h1 class="page-title">Спортсмены</h1>
<button class="btn-add" onclick="addChild()"><span>➕</span><span>Добавить</span></button>
</div>
<div class="filters">
<div class="filter-group">
<label class="filter-label">Поиск</label>
<input type="text" class="filter-input" id="searchInput" placeholder="Имя...">
</div>
<div class="filter-group">
<label class="filter-label">Клуб</label>
<select class="filter-select" id="clubFilter"><option value="">Все</option></select>
</div>
<div class="filter-group">
<label class="filter-label">Группа</label>
<select class="filter-select" id="groupFilter"><option value="">Все</option></select>
</div>
</div>
<div class="table-container">
<div id="loadingChildren" class="loading">Загрузка...</div>
<div id="emptyChildren" class="empty-state" style="display:none"><h3>Нет спортсменов</h3></div>
<table class="table" id="childrenTable" style="display:none">
<thead><tr><th>Фото</th><th>ФИО</th><th>Клуб</th><th>Группа</th><th>Действия</th></tr></thead>
<tbody id="childrenTableBody"></tbody>
</table>
</div>
</div>

</div>

<div class="modal" id="childModal">
<div class="modal-content">
<div class="modal-header">
<h2 class="modal-title" id="childModalTitle">Добавить спортсмена</h2>
<button class="modal-close" onclick="closeChildModal()">✕</button>
</div>
<div class="modal-body">
<form id="childForm" onsubmit="saveChild(event)">
<input type="hidden" id="childId">
<div class="form-group">
<label class="form-label">Имя *</label>
<input type="text" class="form-input" id="childFirstName" required>
</div>
<div class="form-group">
<label class="form-label">Фамилия *</label>
<input type="text" class="form-input" id="childLastName" required>
</div>
<div class="form-group">
<label class="form-label">Дата рождения</label>
<div class="date-inputs">
<div class="form-group"><select class="form-select" id="childBirthDay"><option value="">День</option></select></div>
<div class="form-group"><select class="form-select" id="childBirthMonth"><option value="">Месяц</option></select></div>
<div class="form-group"><select class="form-select" id="childBirthYear"><option value="">Год</option></select></div>
</div>
</div>
<div class="form-group">
<label class="form-label">Группы *</label>
<div id="childGroupsCheckboxes" style="max-height:200px;overflow-y:auto;border:1px solid var(--b);padding:1rem;border-radius:8px;background:#f9f9f9"></div>
</div>
</form>
</div>
<div class="modal-footer">
<button class="btn btn-cancel" onclick="closeChildModal()">Отмена</button>
<button class="btn btn-save" onclick="document.getElementById('childForm').requestSubmit()">Сохранить</button>
</div>
</div>
</div>

<div class="modal" id="groupModal">
<div class="modal-content">
<div class="modal-header">
<h2 class="modal-title" id="groupModalTitle">Добавить группу</h2>
<button class="modal-close" onclick="closeGroupModal()">✕</button>
</div>
<div class="modal-body">
<form id="groupForm" onsubmit="saveGroup(event)">
<input type="hidden" id="groupId">
<div class="form-group">
<label class="form-label">Название *</label>
<input type="text" class="form-input" id="groupName" required>
</div>
</form>
</div>
<div class="modal-footer">
<button class="btn btn-cancel" onclick="closeGroupModal()">Отмена</button>
<button class="btn btn-save" onclick="document.getElementById('groupForm').requestSubmit()">Сохранить</button>
</div>
</div>
</div>

<script>
const API='https://primary-production-4b93e.up.railway.app/webhook/api';
let token=localStorage.getItem('token');
let children=[],groups=[],filtered=[],user=null;
if(!token)window.location.href='/';

function loadUserInfo(){
user=JSON.parse(localStorage.getItem('user')||'{}');
document.getElementById('userName').textContent=user.first_name?`${user.first_name} ${user.last_name||''}`.trim():user.email||'Пользователь';
console.log('User loaded:', user);
}

function switchTab(t){
document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
event.target.classList.add('active');
document.getElementById(`tab-${t}`).classList.add('active');
if(t==='groups'&&groups.length===0)loadGroups();
}

function initDateDropdowns(){
const d=document.getElementById('childBirthDay'),m=document.getElementById('childBirthMonth'),y=document.getElementById('childBirthYear');
for(let i=1;i<=31;i++){const o=document.createElement('option');o.value=i;o.textContent=i;d.appendChild(o)}
['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'].forEach((n,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=n;m.appendChild(o)});
const cy=new Date().getFullYear();
for(let i=cy;i>=cy-20;i--){const o=document.createElement('option');o.value=i;o.textContent=i;y.appendChild(o)}
}

async function loadGroups(){
try{
document.getElementById('loadingGroups').style.display='block';
document.getElementById('emptyGroups').style.display='none';
document.getElementById('groupsTable').style.display='none';
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'groups',action:'list'})});
let d=await r.json();
groups=d.merged||d||[];
document.getElementById('loadingGroups').style.display='none';
if(groups.length===0)document.getElementById('emptyGroups').style.display='block';
else{document.getElementById('groupsTable').style.display='table';renderGroupsTable()}
updateGroupFilter();
}catch(e){console.error(e);document.getElementById('loadingGroups').textContent='❌ Ошибка'}
}

function renderGroupsTable(){
const t=document.getElementById('groupsTableBody');
t.innerHTML='';
groups.forEach(g=>{
const r=document.createElement('tr');
r.innerHTML=`<td data-label="Название">${g.name}</td><td data-label="Клуб">${g.club_name||'-'}</td><td data-label="Действия"><div class="table-actions"><button class="btn-icon btn-edit" onclick="editGroup(${g.id})">✏️</button><button class="btn-icon btn-delete" onclick="deleteGroup(${g.id})">🗑️</button></div></td>`;
t.appendChild(r);
});
}

function updateGroupFilter(){
const s=document.getElementById('groupFilter');
s.innerHTML='<option value="">Все</option>';
groups.forEach(g=>{
const o1=document.createElement('option');o1.value=g.id;o1.textContent=g.name;s.appendChild(o1);
});
renderGroupCheckboxes([]);
}

function renderGroupCheckboxes(selectedIds){
const container=document.getElementById('childGroupsCheckboxes');
if(groups.length===0){
container.innerHTML='<p style="color:#999">Нет доступных групп</p>';
return;
}
container.innerHTML=groups.map(g=>`
<label style="display:block;padding:0.5rem;cursor:pointer;border-bottom:1px solid var(--b)">
<input type="checkbox" value="${g.id}" ${selectedIds.includes(g.id)?'checked':''} style="margin-right:0.5rem">
${g.name} <span style="color:#666">(${g.club_name||'—'})</span>
</label>
`).join('');
}

function updateClubFilter(){
const clubsSet=new Set();
children.forEach(c=>{
if(c.club_names&&c.club_names!=='')clubsSet.add(c.club_names);
});
const clubFilter=document.getElementById('clubFilter');
clubFilter.innerHTML='<option value="">Все</option>';
Array.from(clubsSet).forEach(club=>{
const opt=document.createElement('option');
opt.value=club;
opt.textContent=club;
clubFilter.appendChild(opt);
});
}

async function loadChildren(){
try{
document.getElementById('loadingChildren').style.display='block';
document.getElementById('emptyChildren').style.display='none';
document.getElementById('childrenTable').style.display='none';

const r2=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'trainer_groups',action:'list',data:{trainer_id:user.id}})});
let d2=await r2.json();
const trainerGroups=d2.merged||d2||[];
groups=trainerGroups;
const groupIds=trainerGroups.map(g=>g.id);
console.log('Trainer groups:', groupIds, trainerGroups);
updateGroupFilter();

const r1=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'list'})});
let d1=await r1.json();
let allChildren=d1.merged||d1||[];
console.log('All children loaded:', allChildren.length);

children=allChildren.filter(c=>{
if(!c.group_names||c.group_names==='Без группы')return false;
return groupIds.some(gid=>{
const group=trainerGroups.find(tg=>tg.id===gid);
return group&&c.group_names.includes(group.name);
});
});
console.log('Filtered children for trainer:', children.length);

updateClubFilter();
filtered=children;
document.getElementById('loadingChildren').style.display='none';
if(children.length===0)document.getElementById('emptyChildren').style.display='block';
else{document.getElementById('childrenTable').style.display='table';renderChildrenTable()}
}catch(e){console.error('Error loading children:',e);document.getElementById('loadingChildren').textContent='❌ Ошибка: '+e.message}
}

function renderChildrenTable(){
const t=document.getElementById('childrenTableBody');
t.innerHTML='';
filtered.forEach(c=>{
const r=document.createElement('tr');
r.innerHTML=`<td data-label="Фото"><img src="${c.photo_url||'https://via.placeholder.com/50'}" class="child-photo"></td><td data-label="ФИО"><a href="/athlete-profile.html?id=${c.id}" style="color:var(--p);text-decoration:none;font-weight:600">${c.first_name} ${c.last_name}</a></td><td data-label="Клуб">${c.club_names||'—'}</td><td data-label="Группа"><span class="group-badge">${c.group_names||'Без группы'}</span></td><td data-label="Действия"><div class="table-actions"><button class="btn-icon btn-edit" onclick="editChild(${c.id})">✏️</button><button class="btn-icon btn-delete" onclick="deleteChild(${c.id})">🗑️</button></div></td>`;
t.appendChild(r);
});
}

document.getElementById('searchInput').addEventListener('input',filterChildren);
document.getElementById('clubFilter').addEventListener('change',filterChildren);
document.getElementById('groupFilter').addEventListener('change',filterChildren);

function filterChildren(){
const s=document.getElementById('searchInput').value.toLowerCase();
const club=document.getElementById('clubFilter').value;
const g=document.getElementById('groupFilter').value;
filtered=children.filter(c=>{
const n=(c.first_name+' '+c.last_name).toLowerCase().includes(s);
const clubMatch=!club||(c.club_names&&c.club_names.includes(club));
if(!g)return n&&clubMatch;
const groupName=groups.find(gr=>gr.id==g)?.name;
const gr=groupName&&c.group_names&&c.group_names.includes(groupName);
return n&&clubMatch&&gr;
});
renderChildrenTable();
}

function addChild(){
document.getElementById('childModalTitle').textContent='Добавить';
document.getElementById('childId').value='';
document.getElementById('childFirstName').value='';
document.getElementById('childLastName').value='';
document.getElementById('childBirthDay').value='';
document.getElementById('childBirthMonth').value='';
document.getElementById('childBirthYear').value='';
renderGroupCheckboxes([]);
openChildModal();
}

function editChild(id){
const c=children.find(x=>x.id===id);
if(!c)return;
document.getElementById('childModalTitle').textContent='Редактировать';
document.getElementById('childId').value=c.id;
document.getElementById('childFirstName').value=c.first_name;
document.getElementById('childLastName').value=c.last_name;
if(c.birth_date){
const d=new Date(c.birth_date);
document.getElementById('childBirthDay').value=d.getDate();
document.getElementById('childBirthMonth').value=d.getMonth()+1;
document.getElementById('childBirthYear').value=d.getFullYear();
}

const childGroupNames=c.group_names&&c.group_names!=='Без группы'?c.group_names.split(', '):[];
const childGroupIds=groups.filter(g=>childGroupNames.includes(g.name)).map(g=>g.id);
renderGroupCheckboxes(childGroupIds);

openChildModal();
}

async function saveChild(e){
e.preventDefault();
const id=document.getElementById('childId').value;
const fn=document.getElementById('childFirstName').value.trim();
const ln=document.getElementById('childLastName').value.trim();
const d=document.getElementById('childBirthDay').value;
const m=document.getElementById('childBirthMonth').value;
const y=document.getElementById('childBirthYear').value;
const selectedGroups=Array.from(document.querySelectorAll('#childGroupsCheckboxes input:checked')).map(cb=>parseInt(cb.value));

if(!fn||!ln){alert('Заполните поля');return}
if(selectedGroups.length===0){alert('Выберите хотя бы одну группу');return}

const data={first_name:fn,last_name:ln};
if(d&&m&&y)data.birth_date=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;

try{
if(id){
data.id=parseInt(id);
console.log('UPDATE child:', data);
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'update',data})});
let res=await r.json();
console.log('UPDATE response:', res);
const result=(res.merged&&res.merged[0])||(Array.isArray(res)?res[0]:res);
if(result&&result.id){
const r2=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'list'})});
const d2=await r2.json();
const allChildren=d2.merged||d2||[];
const child=allChildren.find(c=>c.id==parseInt(id));
console.log('Current child data:', child);

const currentGroupNames=child&&child.group_names&&child.group_names!=='Без группы'?child.group_names.split(', '):[];
const currentGroupIds=groups.filter(g=>currentGroupNames.includes(g.name)).map(g=>g.id);
console.log('Current groups:', currentGroupIds, 'Selected groups:', selectedGroups);

for(let gid of currentGroupIds){
if(!selectedGroups.includes(gid)){
console.log('Removing group', gid);
const removeRes=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children_groups',action:'remove',data:{child_id:parseInt(id),group_id:gid}})});
console.log('Remove result:', await removeRes.json());
}
}

for(let gid of selectedGroups){
if(!currentGroupIds.includes(gid)){
console.log('Adding group', gid);
const assignRes=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children_groups',action:'assign',data:{child_id:parseInt(id),group_id:gid}})});
console.log('Assign result:', await assignRes.json());
}
}

closeChildModal();
alert('Обновлено!');
await loadChildren();
}else{
alert('Ошибка: '+(result?.error||JSON.stringify(res)));
}
}else{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'create',data})});
let res=await r.json();
console.log('CREATE response:', res);
const result=(res.merged&&res.merged[0])||(Array.isArray(res)?res[0]:res);
const childId=result?.id||res?.id;
console.log('New child ID:', childId);

if(childId){
for(let gid of selectedGroups){
console.log('Assigning group', gid, 'to child', childId);
const assignRes=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children_groups',action:'assign',data:{child_id:childId,group_id:gid}})});
console.log('Assign result:', await assignRes.json());
}
closeChildModal();
alert('Добавлено!');
await loadChildren();
}else{
alert('Ошибка: не получен ID ребенка. Ответ: '+JSON.stringify(res));
}
}
}catch(err){
console.error(err);
alert('Ошибка: '+err.message);
}
}

async function deleteChild(id){
if(!confirm('Удалить?'))return;
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'children',action:'delete',data:{id}})});
let d=await r.json();
const result=Array.isArray(d)?d[0]:d;
if(result&&result.success){
alert('Удалено');
await loadChildren();
}
}catch(e){console.error(e);alert('Ошибка')}
}

function openChildModal(){
document.getElementById('childModal').classList.add('active');
document.body.style.overflow='hidden';
}

function closeChildModal(){
document.getElementById('childModal').classList.remove('active');
document.body.style.overflow='';
}

function addGroup(){
document.getElementById('groupModalTitle').textContent='Добавить группу';
document.getElementById('groupId').value='';
document.getElementById('groupName').value='';
openGroupModal();
}

function editGroup(id){
const g=groups.find(x=>x.id===id);
if(!g)return;
document.getElementById('groupModalTitle').textContent='Редактировать';
document.getElementById('groupId').value=g.id;
document.getElementById('groupName').value=g.name;
openGroupModal();
}

async function saveGroup(e){
e.preventDefault();
const id=document.getElementById('groupId').value,n=document.getElementById('groupName').value.trim();
if(!n){alert('Введите название');return}
const data={name:n};
try{
const a=id?'update':'create';
if(id)data.id=parseInt(id);
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'groups',action:a,data})});
let res=await r.json();
if(!res){alert('Пустой ответ');return}
const result=(res.merged&&res.merged[0])||(Array.isArray(res)?res[0]:res);
if(result&&result.id){
closeGroupModal();
alert(id?'Обновлено!':'Создано!');
await loadGroups();
await loadChildren();
}else{
alert('Ошибка: '+(result?.error||JSON.stringify(res)));
}
}catch(err){
console.error(err);
alert('Ошибка: '+err.message);
}
}

async function deleteGroup(id){
const g=groups.find(x=>x.id===id);
if(!g)return;
const childrenInGroup=children.filter(c=>c.group_id===id);
if(childrenInGroup.length>0){
alert(`❌ НЕЛЬЗЯ УДАЛИТЬ!\n\nВ группе "${g.name}" есть ${childrenInGroup.length} спортсменов.\n\nСначала переведите всех спортсменов в другие группы, затем удаляйте.`);
return;
}
if(!confirm(`Удалить пустую группу "${g.name}"?`))return;
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'groups',action:'delete',data:{id}})});
let d=await r.json();
const result=(d.merged&&d.merged[0])||(Array.isArray(d)?d[0]:d);
if(result&&result.success){
alert('✅ Группа удалена');
await loadGroups();
await loadChildren();
}
}catch(e){console.error(e);alert('Ошибка')}
}

function openGroupModal(){
document.getElementById('groupModal').classList.add('active');
document.body.style.overflow='hidden';
}

function closeGroupModal(){
document.getElementById('groupModal').classList.remove('active');
document.body.style.overflow='';
}

function logout(){
localStorage.removeItem('token');
localStorage.removeItem('user');
window.location.href='/';
}

loadUserInfo();
initDateDropdowns();
loadChildren();
</script>
</body>
</html>
