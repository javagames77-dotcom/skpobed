<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мероприятие — InSkill.online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{--bg:#ffffff;--bg2:#fafafa;--bg3:#f5f5f5;--border:#e8e8e8;--border2:#d0d0d0;--text:#1a1a1a;--muted:#6b6b6b;--muted2:#b0b0b0;--black:#0a0a0a;--nav-bg:rgba(255,255,255,.96);--sidebar-bg:#ffffff;--input-bg:#fafafa;--card-bg:#ffffff;--card-shadow:0 1px 3px rgba(0,0,0,.06);--tbl-hover:#fafafa;--accent:#E53935;--tag-green-bg:#f0fdf4;--tag-green:#16a34a;--tag-red-bg:#fff0f0;--tag-red:#c0392b;--tag-orange-bg:#fff8e1;--tag-orange:#e65100;--tag-blue-bg:#eff6ff;--tag-blue:#1d4ed8;--p:#0066CC;--s:#FF9933}
[data-theme="dark"]{--bg:#0a0a0a;--bg2:#181818;--bg3:#222222;--border:#3d3d3d;--border2:#505050;--text:#ffffff;--muted:#bbbbbb;--muted2:#999999;--black:#ffffff;--nav-bg:rgba(10,10,10,.97);--sidebar-bg:#0a0a0a;--input-bg:#181818;--card-bg:#181818;--card-shadow:0 1px 3px rgba(0,0,0,.3);--tbl-hover:#222222;--accent:#E53935;--tag-green-bg:#0a2010;--tag-green:#4ade80;--tag-red-bg:#2a1010;--tag-red:#ff7070;--tag-orange-bg:#2a1800;--tag-orange:#fbbf24;--tag-blue-bg:#0c1a3a;--tag-blue:#93c5fd;--p:#4d9de0;--s:#FF9933}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg2);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

/* ── NAV ── */
.nav{height:48px;background:var(--nav-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.logo-text{font-size:15px;font-weight:600;color:var(--black);letter-spacing:-.03em;transition:color .2s}
.logo-text span{font-weight:300;color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav-badge{font-size:10px;font-weight:500;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;letter-spacing:.02em}
.nav-divider{width:1px;height:18px;background:var(--border);flex-shrink:0}
.theme-toggle{width:32px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:all .15s}
.theme-toggle:hover{border-color:var(--border2)}
.lang-switcher{display:flex;align-items:center;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:3px;transition:all .2s}
.lang-btn{padding:3px 8px;border:none;border-radius:5px;background:transparent;color:var(--muted);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.lang-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - 48px)}

/* ── SIDEBAR ── */
.sidebar{width:220px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .2s,border-color .2s;overflow-y:auto}
.sidebar-user{padding:14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:border-color .2s}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--black);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s}
.sidebar-user-name{font-size:12px;font-weight:500;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.sidebar-user-id{font-size:10px;color:var(--muted2);transition:color .2s}
.sidebar-section{padding:14px 12px 6px;font-size:10px;font-weight:500;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 6px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;text-align:left;width:calc(100% - 12px);text-decoration:none}
.sitem:hover{background:var(--bg3);color:var(--text)}
.sitem.active{background:var(--bg3);color:var(--black)}
.sitem svg{flex-shrink:0}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;padding:24px}

/* ── CARD ── */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--card-shadow);overflow:hidden;transition:all .2s}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;color:var(--black)}
.card-body{padding:16px}

/* ── HERO ── */
.hero{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--card-shadow);padding:20px 24px;margin-bottom:16px}
.hero-title{font-size:20px;font-weight:700;color:var(--black);line-height:1.25;margin-bottom:10px;letter-spacing:-.03em}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500}
.chip-date{background:var(--tag-blue-bg);color:var(--tag-blue)}
.chip-loc{background:var(--tag-green-bg);color:var(--tag-green);cursor:pointer}
.chip-loc:hover{opacity:.8}
.chip-groups{background:var(--bg3);color:var(--muted)}
.chip-closed{background:var(--tag-red-bg);color:var(--tag-red)}
.chip-soon{background:var(--tag-orange-bg);color:var(--tag-orange)}
.hero-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-top:10px;border-top:1px solid var(--border);padding-top:12px}

/* ── STRIP ── */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.strip-item{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--card-shadow)}
.strip-label{font-size:10px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.strip-value{font-size:20px;font-weight:700;color:var(--black);line-height:1}
.strip-sub{font-size:11px;color:var(--muted);margin-top:3px}
.strip-value.urgent{color:var(--tag-red)}
.strip-value.soon{color:var(--tag-orange)}
.strip-value.ok{color:var(--tag-green)}
.strip-value.closed{color:var(--muted);font-size:13px;font-weight:600}

/* ── CONTENT GRID ── */
.content-grid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}

/* ── TABLE ── */
.reg-table{width:100%;border-collapse:collapse}
.reg-table th{padding:9px 14px;text-align:left;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.reg-table td{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.reg-table tbody tr:last-child td{border-bottom:none}
.reg-table tbody tr:hover td{background:var(--tbl-hover)}
.athlete-row{display:flex;align-items:center;gap:8px}
.athlete-avatar{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;font-size:11px;font-weight:600;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.athlete-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.athlete-name{font-weight:500;color:var(--black);font-size:12px}
.athlete-group{font-size:11px;color:var(--muted)}
.fee-input{width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;text-align:center;background:var(--input-bg);color:var(--text);font-family:inherit;outline:none;transition:border-color .15s}
.fee-input:focus{border-color:var(--border2)}
.fee-input.changed{border-color:var(--s)}
.fee-save-btn{padding:4px 8px;background:var(--s);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;display:none;font-family:inherit}
.fee-save-btn.visible{display:inline-block}
.paid-label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:12px}
.paid-label.is-paid{color:var(--tag-green);font-weight:500}
.paid-label.not-paid{color:var(--muted)}
.paid-checkbox{width:15px;height:15px;cursor:pointer;accent-color:var(--tag-green)}

/* ── INFO ROWS ── */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-key{font-size:11px;color:var(--muted);font-weight:500}
.info-val{font-size:12px;font-weight:600;color:var(--black);text-align:right;max-width:60%}

/* ── MAP ── */
.map-wrap{border-radius:8px;overflow:hidden}
.map-wrap iframe{display:block;width:100%;height:200px;border:0}

/* ── SKELETON ── */
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--border) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;padding:8px 14px;background:var(--black);color:var(--bg);border-radius:8px;font-size:12px;font-weight:500;z-index:9999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:var(--tag-red)}
.toast.success{background:var(--tag-green)}

/* ── MOBILE NAV ── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--nav-bg);border-top:1px solid var(--border);z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mob-nav-items{display:flex;height:100%}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--muted);font-size:9px;font-weight:500;font-family:inherit;cursor:pointer;transition:color .15s;text-decoration:none}
.mob-nav-btn.active{color:var(--black)}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{display:none}
  .mob-nav{display:block}
  .main{padding:16px 12px 72px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .content-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .hero{padding:14px 16px}
  .hero-title{font-size:17px}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="/" class="nav-logo">
    <svg width="23" height="23" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="1" width="18" height="18" rx="4.5" stroke="var(--black)" stroke-width="1.3"/>
      <path d="M5 15L13 7" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M8 7h5v5" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">InSkill<span>.online</span></span>
  </a>
  <div class="nav-right">
    <span class="nav-badge" id="nav-badge">ДИРЕКТОР</span>
    <div class="nav-divider"></div>
    <div class="lang-switcher">
      <button class="lang-btn" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>

      <svg id="icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <svg id="icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M13.5 10A6 6 0 015 2.5a6 6 0 108 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sideInitials">ДР</div>
    <div>
      <div class="sidebar-user-name" id="sideUserName">—</div>
      <div class="sidebar-user-id" id="sideUserId"></div>
    </div>
  </div>

  <div class="sidebar-section" id="lbl-side-event">Мероприятие</div>
  <a href="#" class="sitem active" id="side-event-link">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 6h14" stroke="currentColor" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M5.5 9.5l2 2 3.5-3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="side-event-title">—</span>

  <div class="sidebar-section" id="lbl-side-nav">Навигация</div>
  <a href="/director-dashboard.html#events" class="sitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L6 8l4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="lbl-back">← Все мероприятия</span>
  </a>
  <a href="/director-dashboard.html" class="sitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.2"/><path d="M4 12L10 6M7 6h3v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="lbl-dashboard">Панель директора</span>
  </a>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- LOADING -->
  <div id="loadingState">
    <div class="hero" style="margin-bottom:16px">
      <div class="skeleton" style="width:55%;height:24px;margin-bottom:10px"></div>
      <div class="skeleton" style="width:35%;height:16px;margin-bottom:6px"></div>
      <div class="skeleton" style="width:25%;height:16px"></div>
    </div>
    <div class="strip">
      <div class="strip-item"><div class="skeleton" style="height:18px;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
      <div class="strip-item"><div class="skeleton" style="height:18px;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
      <div class="strip-item"><div class="skeleton" style="height:18px;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
      <div class="strip-item"><div class="skeleton" style="height:18px;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:60%"></div></div>
    </div>
  </div>

  <!-- ERROR -->
  <div id="errorState" style="display:none">
    <div class="card">
      <div class="card-body" style="text-align:center;padding:48px">
        <div style="font-size:2.5rem;margin-bottom:12px">😕</div>
        <div style="font-size:15px;font-weight:600;color:var(--black);margin-bottom:6px" id="errTitle">Мероприятие не найдено</div>
        <a href="/director-dashboard.html#events" style="font-size:12px;color:var(--p)" id="errBack">← Вернуться</a>
      </div>
    </div>
  </div>

  <!-- PAGE CONTENT -->
  <div id="pageContent" style="display:none">

    <!-- HERO -->
    <div class="hero">
      <div id="heroTitle" class="hero-title">—</div>
      <div id="heroChips" class="hero-chips"></div>
      <div id="heroDesc" class="hero-desc" style="display:none"></div>
    </div>

    <!-- STRIP -->
    <div class="strip">
      <div class="strip-item">
        <div class="strip-label" id="lbl-cd-event">До мероприятия</div>
        <div id="cdEvent" class="strip-value">—</div>
        <div id="cdEventSub" class="strip-sub"></div>
      </div>
      <div class="strip-item">
        <div class="strip-label" id="lbl-cd-deadline">Срок регистрации</div>

        <div id="cdDeadlineSub" class="strip-sub"></div>
      </div>
      <div class="strip-item">
        <div class="strip-label" id="lbl-stat-reg">Записалось</div>
        <div id="statReg" class="strip-value">—</div>
      </div>
      <div class="strip-item">
        <div class="strip-label" id="lbl-stat-paid">Оплатили</div>
        <div id="statPaid" class="strip-value">—</div>
        <div id="statTotal" class="strip-sub"></div>
      </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="content-grid">

      <!-- LEFT: registrations -->
      <div class="card" id="regsCard" style="display:none">
        <div class="card-header">
          <span class="card-title" id="lbl-regs-title">Записавшиеся спортсмены</span>

      <!-- RIGHT: details + map -->

            <div class="map-wrap">
              <iframe id="mapIframe" src="" frameborder="0" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>

</div><!-- /layout -->

<!-- MOBILE BOTTOM NAV -->
<nav class="mob-nav">

      <span id="mob-lbl-event">Мероприятие</span>

    <button class="mob-nav-btn" onclick="mobScroll('regsCard')">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h8M2 12h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span id="mob-lbl-athletes">Спортсмены</span>
    </button>
    <button class="mob-nav-btn" onclick="mobScroll('mapCard')">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M8 1.5C5.5 1.5 3.5 3.5 3.5 6c0 3.5 4.5 8.5 4.5 8.5S12.5 9.5 12.5 6c0-2.5-2-4.5-4.5-4.5z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="6" r="1.5" stroke="currentColor" stroke-width="1.2"/></svg>

<div class="toast" id="toast"></div>

<script>
/* ── i18n ── */
const i18n={
  uk:{
    navBadge:'ДИРЕКТОР',
    sideEvent:'Захід',sideNav:'Навігація',
    backEvents:'← Всі заходи',dashboard:'Панель директора',
    errTitle:'Захід не знайдено',errBack:'← Повернутись',
    cdEvent:'До заходу',cdDeadline:'Термін реєстрації',
    statReg:'Записалось',statPaid:'Сплатили',
    regsTitle:'Спортсмени, що записались',
    thAthlete:'Спортсмен',thFee:'Внесок',thPaid:'Сплатив',
    details:'📋 Деталі',mapTitle:'📍 Місце проведення',mapsLink:'Відкрити в Maps',
    infoDate:'Дата',infoDeadline:'Дедлайн реєстрації',infoLoc:'Місце',infoBudget:'Бюджет',infoFee:'Сума внеску',
    daysAgo:'дн. тому',daysLeft:'дн.',passed:'Пройшов',today:'Сьогодні!',
    regClosed:'🔒 Реєстрацію закрито',regLastDay:'⚡ Останній день!',regSoon:'⏳ Скоро закриється',
    notSet:'Не задано',regOpen:'Відкрито',
    feeOk:'Внесок збережено',feeSaveErr:'Помилка збереження',
    paidOk:'Позначено як сплатив',unpaidOk:'Позначку знято',
    saveErr:'Помилка: ',isPaid:'Сплатив',notPaid:'Не сплатив',
    mobBack:'Назад',mobEvent:'Захід',mobAthletes:'Спортсмени',mobMap:'Карта'
  },
  ru:{
    navBadge:'ДИРЕКТОР',
    sideEvent:'Мероприятие',sideNav:'Навигация',
    backEvents:'← Все мероприятия',dashboard:'Панель директора',
    errTitle:'Мероприятие не найдено',errBack:'← Вернуться',
    cdEvent:'До мероприятия',cdDeadline:'Срок регистрации',
    statReg:'Записалось',statPaid:'Оплатили',
    regsTitle:'Записавшиеся спортсмены',
    thAthlete:'Спортсмен',thFee:'Взнос',thPaid:'Оплатил',
    details:'📋 Детали',mapTitle:'📍 Место проведения',mapsLink:'Открыть в Maps',
    infoDate:'Дата',infoDeadline:'Дедлайн регистрации',infoLoc:'Место',infoBudget:'Бюджет',infoFee:'Сумма взноса',
    daysAgo:'дн. назад',daysLeft:'дн.',passed:'Прошло',today:'Сегодня!',
    regClosed:'🔒 Регистрация закрыта',regLastDay:'⚡ Последний день!',regSoon:'⏳ Скоро закрывается',
    notSet:'Не задан',regOpen:'Открыта',
    feeOk:'Взнос сохранён',feeSaveErr:'Ошибка сохранения',
    paidOk:'Отмечен как оплативший',unpaidOk:'Отметка снята',
    saveErr:'Ошибка: ',isPaid:'Оплатил',notPaid:'Не оплатил',
    mobBack:'Назад',mobEvent:'Мероприятие',mobAthletes:'Спортсмены',mobMap:'Карта'
  },
  en:{
    navBadge:'DIRECTOR',
    sideEvent:'Event',sideNav:'Navigation',
    backEvents:'← All events',dashboard:'Director panel',
    errTitle:'Event not found',errBack:'← Return',
    cdEvent:'Until event',cdDeadline:'Reg. deadline',
    statReg:'Registered',statPaid:'Paid',
    regsTitle:'Registered athletes',
    thAthlete:'Athlete',thFee:'Fee',thPaid:'Paid',
    details:'📋 Details',mapTitle:'📍 Venue',mapsLink:'Open in Maps',
    infoDate:'Date',infoDeadline:'Registration deadline',infoLoc:'Venue',infoBudget:'Budget',infoFee:'Entry fee',
    daysAgo:'d. ago',daysLeft:'d.',passed:'Passed',today:'Today!',
    regClosed:'🔒 Registration closed',regLastDay:'⚡ Last day!',regSoon:'⏳ Closing soon',
    notSet:'Not set',regOpen:'Open',
    feeOk:'Fee saved',feeSaveErr:'Save error',
    paidOk:'Marked as paid',unpaidOk:'Mark removed',
    saveErr:'Error: ',isPaid:'Paid',notPaid:'Not paid',
    mobBack:'Back',mobEvent:'Event',mobAthletes:'Athletes',mobMap:'Map'
  }
};
let currentLang=localStorage.getItem('lang')||'uk';
function t(k){return(i18n[currentLang]||i18n.ru)[k]||k;}
function esc(s){return String(s==null?''  :s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function applyLang(){
  document.documentElement.lang=currentLang;
  document.querySelectorAll('.lang-btn').forEach(btn=>{
    const map={'UA':'uk','RU':'ru','EN':'en'};
    btn.classList.toggle('active',map[btn.textContent]===currentLang);
  });
  const s=(id,key)=>{const e=document.getElementById(id);if(e)e.textContent=t(key);};
  s('nav-badge','navBadge');
  s('lbl-side-event','sideEvent');s('lbl-side-nav','sideNav');
  s('lbl-back','backEvents');s('lbl-dashboard','dashboard');
  s('errTitle','errTitle');s('errBack','errBack');
  s('lbl-cd-event','cdEvent');s('lbl-cd-deadline','cdDeadline');
  s('lbl-stat-reg','statReg');s('lbl-stat-paid','statPaid');
  s('lbl-regs-title','regsTitle');
  s('th-athlete','thAthlete');s('th-paid','thPaid');
  s('lbl-details','details');s('lbl-map','mapTitle');
  s('mob-lbl-back','mobBack');s('mob-lbl-event','mobEvent');
  s('mob-lbl-athletes','mobAthletes');s('mob-lbl-map','mobMap');
  const ml=document.getElementById('mapLink');if(ml)ml.textContent=t('mapsLink');
}

function setLang(lang){
  currentLang=lang;localStorage.setItem('lang',lang);
  applyLang();
  if(eventData){renderEvent();renderRegistrations();}
}

/* ── THEME ── */
function toggleTheme(){
  const html=document.documentElement;
  const isDark=html.getAttribute('data-theme')==='dark';
  const n=isDark?'light':'dark';
  html.setAttribute('data-theme',n);localStorage.setItem('theme',n);
  document.getElementById('icon-sun').style.display=isDark?'block':'none';
  document.getElementById('icon-moon').style.display=isDark?'none':'block';
}
(function(){
  const s=localStorage.getItem('theme');
  if(s==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('icon-sun').style.display='none';
    document.getElementById('icon-moon').style.display='block';
  }
})();

/* ── MOBILE SCROLL ── */
function mobScroll(id){
  const el=document.getElementById(id);
  if(el&&el.style.display!=='none')el.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ── API & STATE ── */
const API='https://primary-production-4b93e.up.railway.app/webhook/api';
let token=localStorage.getItem('token');
let eventId=null,eventData=null,registrations=[];
if(!token){window.location.href='/';throw new Error('No auth');}

/* ── TOAST ── */
function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+(type||'');
  setTimeout(()=>el.className='toast',2500);
}

/* ── DATE UTILS ── */
function daysUntil(dateStr){
  if(!dateStr)return null;
  const t=new Date(dateStr);t.setHours(23,59,59);
  return Math.ceil((t-new Date())/(1000*60*60*24));
}
function fmtDate(d){return d?new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';}
function fmtDateLong(d){
  if(!d)return '—';
  const loc=currentLang==='en'?'en-GB':currentLang==='uk'?'uk-UA':'ru-RU';
  return new Date(d).toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric'});
}

/* ── INIT ── */
async function init(){
  applyLang();
  try{
    const u=JSON.parse(localStorage.getItem('user')||'{}');
    if(u.first_name||u.last_name){
      const fn=u.first_name||'',ln=u.last_name||'';
      document.getElementById('sideInitials').textContent=(fn[0]||'')+(ln[0]||'')||'ДР';
      document.getElementById('sideUserName').textContent=(fn+' '+ln).trim();
      document.getElementById('sideUserId').textContent='ID: '+u.id;
    }
  }catch(e){}

  const params=new URLSearchParams(location.search);
  eventId=params.get('id');
  if(!eventId){showError();return;}
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'events',action:'get',data:{id:parseInt(eventId)}})});
    const d=await r.json();
    eventData=(d.merged&&d.merged[0])||(Array.isArray(d)?d[0]:d);
    if(!eventData||!eventData.id){showError();return;}
    document.getElementById('loadingState').style.display='none';
    document.getElementById('pageContent').style.display='block';
    document.title=(eventData.title||'Event')+' — InSkill.online';
    const st=document.getElementById('side-event-title');
    if(st)st.textContent=eventData.title||'—';
    renderEvent();
    await loadRegistrations();
  }catch(e){console.error(e);showError();}
}

function showError(){
  document.getElementById('loadingState').style.display='none';
  document.getElementById('errorState').style.display='block';
}

/* ── RENDER EVENT ── */
function renderEvent(){
  const ev=eventData;
  const cur=ev.currency||'грн';
  document.getElementById('heroTitle').textContent=ev.title||'—';

  // Chips
  const chips=document.getElementById('heroChips');
  chips.innerHTML='';
  const dl=ev.registration_deadline;
  const dDl=daysUntil(dl);
  if(dl&&dDl<0) chips.innerHTML+=`<span class="chip chip-closed">${t('regClosed')}</span>`;
  else if(dl&&dDl===0) chips.innerHTML+=`<span class="chip chip-soon">${t('regLastDay')}</span>`;
  else if(dl&&dDl!==null&&dDl<=3) chips.innerHTML+=`<span class="chip chip-soon">${t('regSoon')}</span>`;
  if(ev.event_date) chips.innerHTML+=`<span class="chip chip-date">📅 ${fmtDateLong(ev.event_date)}</span>`;
  if(ev.location){
    const chip=document.createElement('span');
    chip.className='chip chip-loc';chip.innerHTML=`📍 ${esc(ev.location)}`;
    chip.onclick=()=>window.open(`https://www.google.com/maps/search/${encodeURIComponent(ev.location)}`,'_blank');
    chips.appendChild(chip);
  }
  if(ev.group_names) chips.innerHTML+=`<span class="chip chip-groups">👥 ${esc(ev.group_names)}</span>`;

  if(ev.description){const desc=document.getElementById('heroDesc');desc.textContent=ev.description;desc.style.display='block';}

  // Countdown event
  const dEv=daysUntil(ev.event_date);
  const cdEv=document.getElementById('cdEvent'),cdEvSub=document.getElementById('cdEventSub');
  if(dEv===null){cdEv.textContent='—';}
  else if(dEv<0){cdEv.className='strip-value closed';cdEv.textContent=t('passed');cdEvSub.textContent=Math.abs(dEv)+' '+t('daysAgo');}
  else if(dEv===0){cdEv.className='strip-value urgent';cdEv.textContent=t('today');}
  else if(dEv<=7){cdEv.className='strip-value soon';cdEv.textContent=dEv+' '+t('daysLeft');cdEvSub.textContent=fmtDate(ev.event_date);}
  else{cdEv.className='strip-value ok';cdEv.textContent=dEv+' '+t('daysLeft');cdEvSub.textContent=fmtDate(ev.event_date);}

  // Countdown deadline
  const cdDl=document.getElementById('cdDeadline'),cdDlSub=document.getElementById('cdDeadlineSub');
  if(!dl){cdDl.className='strip-value';cdDl.textContent=t('notSet');cdDlSub.textContent=t('regOpen');}
  else if(dDl<0){cdDl.className='strip-value closed';cdDl.textContent=t('passed');cdDlSub.textContent=fmtDate(dl);}
  else if(dDl===0){cdDl.className='strip-value urgent';cdDl.textContent=t('today');cdDlSub.textContent='';}
  else if(dDl<=3){cdDl.className='strip-value soon';cdDl.textContent=dDl+' '+t('daysLeft');cdDlSub.textContent=fmtDate(dl);}
  else{cdDl.className='strip-value ok';cdDl.textContent=dDl+' '+t('daysLeft');cdDlSub.textContent=fmtDate(dl);}

  // Info rows
  document.getElementById('infoRows').innerHTML=[
    [t('infoDate'),fmtDateLong(ev.event_date)],
    [t('infoDeadline'),dl?fmtDateLong(dl):'—'],
    [t('infoLoc'),ev.location||'—'],
    [t('infoBudget'),ev.budget?ev.budget+' '+cur:'—'],
    [t('infoFee'),ev.entry_fee?ev.entry_fee+' '+cur:'—'],
  ].map(([k,v])=>`<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v}</span></div>`).join('');

  // Map
  if(ev.location){
    const mapCard=document.getElementById('mapCard');
    document.getElementById('mapLink').href=`https://www.google.com/maps/search/${encodeURIComponent(ev.location)}`;
    mapCard.style.display='block';
    fetch('https://primary-production-4b93e.up.railway.app/webhook/geocode',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({address:ev.location})
    }).then(r=>r.json()).then(data=>{
      const res=data.results||data;
      if(res&&res[0]&&res[0].lat){
        const lat=parseFloat(res[0].lat),lon=parseFloat(res[0].lon),d=0.012;
        document.getElementById('mapIframe').src=
          `https://www.openstreetmap.org/export/embed.html?bbox=${lon-d},${lat-d},${lon+d},${lat+d}&layer=mapnik&marker=${lat},${lon}`;
      }else{mapCard.style.display='none';}
    }).catch(()=>{mapCard.style.display='none';});
  }
}

/* ── REGISTRATIONS ── */
async function loadRegistrations(){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'event_registrations',action:'list',data:{event_id:parseInt(eventId)}})});
    const d=await r.json();
    registrations=(d.merged||d||[]).filter(r=>r&&r.id);
    renderRegistrations();
  }catch(e){document.getElementById('loadingRegs').textContent=t('saveErr')+e.message;}
}

function renderRegistrations(){
  document.getElementById('loadingRegs').style.display='none';
  const cur=eventData.currency||'грн';
  const tbody=document.getElementById('regsTableBody');
  tbody.innerHTML='';

  const thFee=document.getElementById('th-fee');
  if(thFee)thFee.textContent=t('thFee')+' ('+cur+')';

  const totalPaid=registrations.filter(r=>r.is_paid).length;
  const totalFee=registrations.reduce((s,r)=>s+(parseFloat(r.entry_fee)||0),0);
  document.getElementById('statReg').textContent=registrations.length;
  document.getElementById('statPaid').textContent=totalPaid;
  document.getElementById('statTotal').textContent=totalFee>0?totalFee+' '+cur:'';
  document.getElementById('regCountBadge').textContent=registrations.length;

  if(registrations.length===0){
    document.getElementById('regsCard').style.display='none';
    return;
  }
  document.getElementById('regsCard').style.display='block';
  document.getElementById('regsTableWrap').style.display='block';

  const defaultFee=eventData.entry_fee||0;
  registrations.forEach(reg=>{
    const tr=document.createElement('tr');
    const photo=reg.photo_url||null;
    const fee=reg.entry_fee!==null&&reg.entry_fee!==undefined?reg.entry_fee:defaultFee;
    const isPaid=!!reg.is_paid;
    tr.innerHTML=`
      <td><div class="athlete-row">
        ${photo?`<img src="${photo}" class="athlete-photo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:``}
        <div class="athlete-avatar" style="display:${photo?'none':'flex'}">${(reg.first_name||'?')[0]}${(reg.last_name||'')[0]||''}</div>
        <div><div class="athlete-name">${esc(reg.first_name||'')} ${esc(reg.last_name||'')}</div><div class="athlete-group">${esc(reg.group_name||'')}</div></div>
      </div></td>
      <td><div style="display:flex;align-items:center;gap:4px">
        <input type="number" class="fee-input" id="fee_${reg.id}" value="${fee}" min="0" onchange="onFeeChange(${reg.id},this)" oninput="onFeeChange(${reg.id},this)">
        <button class="fee-save-btn" id="feebtn_${reg.id}" onclick="saveFee(${reg.id})">✓</button>
      </div></td>
      <td><label class="paid-label ${isPaid?'is-paid':'not-paid'}" id="paidlabel_${reg.id}">
        <input type="checkbox" class="paid-checkbox" id="paid_${reg.id}" ${isPaid?'checked':''} onchange="togglePaid(${reg.id},this)">
        ${isPaid?t('isPaid'):t('notPaid')}
      </label></td>`;
    tbody.appendChild(tr);
  });
}

/* ── FEE ── */
function onFeeChange(regId,input){
  input.classList.add('changed');
  document.getElementById('feebtn_'+regId).classList.add('visible');
}
async function saveFee(regId){
  const input=document.getElementById('fee_'+regId);
  const newFee=parseInt(input.value)||0;
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'event_registrations',action:'update',data:{id:regId,entry_fee:newFee}})});
    const d=await r.json();
    if((d.merged&&d.merged[0]?.id)||d.id||d.success){
      input.classList.remove('changed');
      document.getElementById('feebtn_'+regId).classList.remove('visible');
      const reg=registrations.find(r=>r.id===regId);if(reg)reg.entry_fee=newFee;
      const cur=eventData.currency||'грн';
      const total=registrations.reduce((s,r)=>s+(parseFloat(r.entry_fee)||0),0);
      document.getElementById('statTotal').textContent=total>0?total+' '+cur:'';
      showToast(t('feeOk'));
    }else{showToast(t('feeSaveErr'),'error');}
  }catch(e){showToast(t('saveErr')+e.message,'error');}
}

/* ── PAID ── */
async function togglePaid(regId,checkbox){
  const isPaid=checkbox.checked;
  const label=document.getElementById('paidlabel_'+regId);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,resource:'event_registrations',action:'update',data:{id:regId,is_paid:isPaid}})});
    const d=await r.json();
    if((d.merged&&d.merged[0]?.id)||d.id||d.success){
      label.className='paid-label '+(isPaid?'is-paid':'not-paid');
      label.innerHTML=`<input type="checkbox" class="paid-checkbox" id="paid_${regId}" ${isPaid?'checked':''} onchange="togglePaid(${regId},this)">${isPaid?t('isPaid'):t('notPaid')}`;
      const reg=registrations.find(r=>r.id===regId);if(reg)reg.is_paid=isPaid;
      document.getElementById('statPaid').textContent=registrations.filter(r=>r.is_paid).length;
      showToast(isPaid?t('paidOk'):t('unpaidOk'));
    }else{checkbox.checked=!isPaid;showToast(t('feeSaveErr'),'error');}
  }catch(e){checkbox.checked=!isPaid;showToast(t('saveErr')+e.message,'error');}
}

init();
</script>
</body>
</html>
