<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль группы - InSkill</title>
<style>
:root{--p:#0066CC;--s:#FF9933;--d:#1a1a1a;--l:#f8f9fa;--b:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:var(--l);color:var(--d)}
.header{background:#fff;border-bottom:3px solid var(--p);padding:1rem 2rem}
.btn-back{padding:0.5rem 1rem;background:var(--p);color:#fff;border:none;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
.container{max-width:1200px;margin:2rem auto;padding:0 2rem}
.profile-card{background:#fff;padding:2rem;border-radius:12px;margin-bottom:2rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.profile-header h1{font-size:2rem;color:var(--p);margin-bottom:0.5rem}
.profile-header p{color:#666;margin-bottom:0.25rem}
.section{background:#fff;padding:2rem;border-radius:12px;margin-bottom:2rem;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.section-title{font-size:1.5rem;color:var(--p);margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:2px solid var(--b)}
.schedule-grid{display:grid;gap:1rem;margin-top:1rem}
.schedule-day{padding:1rem;background:var(--l);border-radius:8px;border-left:4px solid var(--p)}
.schedule-day h3{color:var(--p);font-size:1.1rem;margin-bottom:0.5rem}
.schedule-day p{color:#666;font-size:0.95rem}
.list-grid{display:grid;gap:1rem;margin-top:1rem}
.list-item{padding:1rem;background:var(--l);border-radius:8px;display:flex;align-items:center;gap:1rem}
.list-item img{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px solid var(--b)}
.list-item-info h4{color:var(--p);font-size:1rem;margin-bottom:0.25rem}
.list-item-info p{color:#666;font-size:0.9rem}
.empty{text-align:center;padding:2rem;color:#999}
.loading{text-align:center;padding:3rem;color:var(--p)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:2rem}
.modal-title{font-size:1.5rem;color:var(--p);margin-bottom:1.5rem}
.schedule-item{background:var(--l);padding:1rem;border-radius:8px;margin-bottom:1rem;display:flex;gap:1rem;align-items:start}
.schedule-item select,.schedule-item input{padding:0.5rem;border:2px solid var(--b);border-radius:6px;font-size:0.9rem}
.schedule-item button{padding:0.5rem;background:#ffebee;color:#dc3545;border:none;border-radius:6px;cursor:pointer}
.btn-add{padding:0.75rem 1.5rem;background:var(--p);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:1rem}
.btn-save{padding:0.75rem 1.5rem;background:var(--s);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.btn-cancel{padding:0.75rem 1.5rem;background:var(--l);color:var(--d);border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-right:1rem}
</style>
</head>
<body>
<div class="header">
<a href="/director-dashboard.html#groups" class="btn-back">← Назад к группам</a>
</div>

<div class="container">
<div class="profile-card">
<div class="profile-header">
<h1 id="groupName">—</h1>
<p>🏢 Клуб: <span id="clubName">—</span></p>
<p>👥 Детей: <span id="childrenCount">—</span></p>
<p>👨‍🏫 Тренеров: <span id="trainersCount">—</span></p>
</div>
</div>

<div class="section">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
<h2 class="section-title" style="margin:0;border:none">📅 Расписание</h2>
<button class="btn-edit" onclick="openScheduleModal()" style="padding:0.5rem 1rem;background:var(--s);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">Редактировать</button>
</div>
<div id="scheduleContainer" class="loading">Загрузка...</div>
</div>

<div class="section">
<h2 class="section-title">👨‍🏫 Тренеры</h2>
<div id="trainersContainer" class="loading">Загрузка...</div>
</div>

<div class="section">
<h2 class="section-title">👥 Спортсмены</h2>
<div id="childrenContainer" class="loading">Загрузка...</div>
</div>
</div>

<div class="modal" id="scheduleModal">
<div class="modal-content">
<h2 class="modal-title">Редактировать расписание</h2>
<button class="btn-add" onclick="addScheduleItem()">➕ Добавить занятие</button>
<div id="scheduleItems"></div>
<div style="margin-top:1.5rem">
<button class="btn-cancel" onclick="closeScheduleModal()">Отмена</button>
<button class="btn-save" onclick="saveSchedule()">Сохранить</button>
</div>
</div>
</div>

<script>
const API='https://primary-production-4b93e.up.railway.app/webhook/api';
const token=localStorage.getItem('token');
const groupId=new URLSearchParams(location.search).get('id');
let currentGroup=null;
let scheduleData=[];

if(!token||!groupId){location.href='/';throw new Error('No auth');}

function openScheduleModal(){
scheduleData=currentGroup.schedule&&currentGroup.schedule!=='[]'?(typeof currentGroup.schedule==='string'?JSON.parse(currentGroup.schedule):currentGroup.schedule):[];
renderScheduleItems();
document.getElementById('scheduleModal').classList.add('active');
}

function closeScheduleModal(){
document.getElementById('scheduleModal').classList.remove('active');
}

function renderScheduleItems(){
const container=document.getElementById('scheduleItems');
if(scheduleData.length===0){
container.innerHTML='<p style="color:#999;text-align:center">Нет занятий</p>';
return;
}
const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const html=scheduleData.map((s,i)=>`
<div class="schedule-item">
<select onchange="updateScheduleDay(${i},this.value)" style="flex:1">
${days.map((d,idx)=>`<option value="${idx}" ${s.day==idx?'selected':''}>${d}</option>`).join('')}
</select>
<input type="time" value="${s.time||''}" onchange="updateScheduleTime(${i},this.value)" style="flex:1">
<input type="text" value="${s.location||''}" placeholder="Место" onchange="updateScheduleLocation(${i},this.value)" style="flex:1">
<button onclick="removeScheduleItem(${i})">🗑️</button>
</div>
`).join('');
container.innerHTML=html;
}

function addScheduleItem(){
scheduleData.push({day:0,time:'18:00',location:''});
renderScheduleItems();
}

function removeScheduleItem(idx){
scheduleData.splice(idx,1);
renderScheduleItems();
}

function updateScheduleDay(idx,val){scheduleData[idx].day=parseInt(val)}
function updateScheduleTime(idx,val){scheduleData[idx].time=val}
function updateScheduleLocation(idx,val){scheduleData[idx].location=val}

async function saveSchedule(){
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'groups',action:'update',data:{id:parseInt(groupId),name:currentGroup.name,club_id:currentGroup.club_id,schedule:JSON.stringify(scheduleData)}})});
const res=await r.json();
if(res.id||res.success){
alert('Расписание сохранено!');
closeScheduleModal();
loadGroup();
}else{
alert('Ошибка: '+JSON.stringify(res));
}
}catch(e){console.error(e);alert('Ошибка: '+e.message)}
}

async function loadGroup(){
try{
const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,resource:'groups',action:'get',data:{id:parseInt(groupId)}})});
const d=await r.json();
const group=Array.isArray(d)?d[0]:d;

if(!group||!group.id){alert('Группа не найдена');history.back();return;}

currentGroup=group;

document.getElementById('groupName').textContent=group.name;
document.getElementById('clubName').textContent=group.club_name||'—';
document.getElementById('childrenCount').textContent=group.children_count||0;
document.getElementById('trainersCount').textContent=group.trainers_count||0;

renderSchedule(group.schedule);
renderTrainers(group.trainers);
renderChildren(group.children);
}catch(e){console.error(e);alert('Ошибка загрузки')}
}

function renderSchedule(schedule){
const container=document.getElementById('scheduleContainer');
if(!schedule||schedule.length===0||schedule==='[]'){
container.innerHTML='<p class="empty">Расписание не задано</p>';
return;
}
const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const parsedSchedule=typeof schedule==='string'?JSON.parse(schedule):schedule;
const html=parsedSchedule.map((s,i)=>`
<div class="schedule-day">
<h3>${days[s.day]||'День '+s.day}</h3>
<p>🕐 ${s.time}</p>
${s.location?`<p>📍 ${s.location}</p>`:''}
</div>
`).join('');
container.innerHTML=`<div class="schedule-grid">${html}</div>`;
}

function renderTrainers(trainers){
const container=document.getElementById('trainersContainer');
if(!trainers||trainers.length===0||trainers[0]===null){
container.innerHTML='<p class="empty">Нет тренеров</p>';
return;
}
const html=trainers.map(t=>`
<div class="list-item">
<img src="${t.photo_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(t.trainer_name)}" alt="${t.trainer_name}">
<div class="list-item-info">
<h4>${t.trainer_name}</h4>
<p>📧 ${t.trainer_email}</p>
${t.trainer_phone?`<p>📱 ${t.trainer_phone}</p>`:''}
</div>
</div>
`).join('');
container.innerHTML=`<div class="list-grid">${html}</div>`;
}

function renderChildren(children){
const container=document.getElementById('childrenContainer');
if(!children||children.length===0||children[0]===null){
container.innerHTML='<p class="empty">Нет спортсменов</p>';
return;
}
const html=children.map(c=>`
<div class="list-item">
<img src="${c.photo_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(c.child_name)}" alt="${c.child_name}">
<div class="list-item-info">
<h4><a href="/athlete-profile.html?id=${c.child_id}" style="color:var(--p);text-decoration:none">${c.child_name}</a></h4>
${c.birth_date?`<p>🎂 ${new Date(c.birth_date).toLocaleDateString('ru-RU')}</p>`:''}
</div>
</div>
`).join('');
container.innerHTML=`<div class="list-grid">${html}</div>`;
}

loadGroup();
</script>
</body>
</html>
