<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — InSkill Online</title>
<style>
:root {
  --primary: #0066CC;
  --secondary: #FF9933;
  --dark: #1a1a1a;
  --light: #f8f9fa;
  --border: #e0e0e0;
  --success: #28a745;
  --danger: #dc3545;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
  background: linear-gradient(135deg, #0066CC 0%, #0052a3 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.login-container {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}

.login-header {
  background: white;
  padding: 2.5rem 2rem 1.5rem;
  text-align: center;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 2rem;
  font-weight: 700;
  color: var(--primary);
  text-decoration: none;
  margin-bottom: 1rem;
}

.logo-icon {
  width: 60px;
  height: 60px;
  background: var(--primary);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.logo-bars {
  display: flex;
  gap: 4px;
  align-items: flex-end;
}

.logo-bar {
  width: 8px;
  background: white;
  border-radius: 3px;
}

.logo-bar:nth-child(1) { height: 16px; }
.logo-bar:nth-child(2) { height: 26px; background: var(--secondary); }
.logo-bar:nth-child(3) { height: 36px; background: var(--secondary); }

.login-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 0.5rem;
}

.login-subtitle {
  color: #666;
  font-size: 0.95rem;
}

.login-body {
  padding: 2rem;
  background: #fafafa;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-label {
  display: block;
  margin-bottom: 0.5rem;
  font-size: 0.9rem;
  font-weight: 600;
  color: #555;
}

.form-input {
  width: 100%;
  padding: 0.95rem 1rem;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 1rem;
  transition: all 0.3s;
  background: white;
}

.form-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(0,102,204,0.1);
}

.form-input::placeholder {
  color: #999;
}

.password-wrapper {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  color: #999;
  padding: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.toggle-password:hover {
  color: var(--primary);
}

.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  font-size: 0.9rem;
}

.remember-me {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
}

.remember-me input {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.forgot-password {
  color: var(--primary);
  text-decoration: none;
  font-weight: 500;
}

.forgot-password:hover {
  text-decoration: underline;
}

.btn-login {
  width: 100%;
  padding: 1rem;
  background: linear-gradient(135deg, var(--secondary), #ff8800);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(255,153,51,0.3);
}

.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255,153,51,0.4);
}

.btn-login:active {
  transform: translateY(0);
}

.btn-login:disabled {
  background: #ccc;
  cursor: not-allowed;
  box-shadow: none;
}

.divider {
  text-align: center;
  margin: 1.5rem 0;
  position: relative;
  color: #999;
  font-size: 0.85rem;
}

.divider:before,
.divider:after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: var(--border);
}

.divider:before { left: 0; }
.divider:after { right: 0; }

.signup-link {
  text-align: center;
  color: #666;
  font-size: 0.95rem;
}

.signup-link a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}

.signup-link a:hover {
  text-decoration: underline;
}

.alert {
  padding: 0.85rem 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  font-size: 0.9rem;
  display: none;
}

.alert-error {
  background: #ffe6e6;
  color: var(--danger);
  border-left: 4px solid var(--danger);
}

.alert-success {
  background: #e6ffe6;
  color: var(--success);
  border-left: 4px solid var(--success);
}

.role-switcher{display:flex;background:#f0f2f5;border-radius:10px;padding:4px;margin-bottom:1.5rem;gap:4px}
.role-btn{flex:1;padding:.6rem;border:none;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:600;background:transparent;color:#666;transition:all .2s}
.role-btn.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.loading-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.6s linear infinite;
  margin-right: 0.5rem;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Mobile Styles */
@media (max-width: 768px) {
  .login-container {
    border-radius: 16px;
  }

  .login-header {
    padding: 2rem 1.5rem 1rem;
  }

  .logo {
    font-size: 1.75rem;
  }

  .logo-icon {
    width: 50px;
    height: 50px;
  }

  .logo-bar:nth-child(1) { height: 14px; }
  .logo-bar:nth-child(2) { height: 22px; }
  .logo-bar:nth-child(3) { height: 30px; }

  .login-title {
    font-size: 1.35rem;
  }

  .login-body {
    padding: 1.5rem;
  }

  .form-footer {
    flex-direction: column;
    gap: 1rem;
    align-items: flex-start;
  }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo">
      <div class="logo-icon">
        <div class="logo-bars">
          <div class="logo-bar"></div>
          <div class="logo-bar"></div>
          <div class="logo-bar"></div>
        </div>
      </div>
      <span>InSkill<span style="color: var(--secondary)">.online</span></span>
    </div>
    <h1 class="login-title">Добро пожаловать!</h1>
    <p class="login-subtitle">Войдите чтобы продолжить</p>
  </div>

  <div class="login-body">
    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <div class="role-switcher">
      <button type="button" class="role-btn active" id="btnStaff" onclick="switchRole('staff')">👔 Тренер / Директор</button>
      <button type="button" class="role-btn" id="btnAthlete" onclick="switchRole('athlete')">🥋 Спортсмен</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group" id="emailGroup">
        <label class="form-label" for="email">Email</label>
        <input 
          type="email" 
          class="form-input" 
          id="email" 
          placeholder="your@email.com"
          autocomplete="email"
        >
      </div>
      <div class="form-group" id="loginGroup" style="display:none">
        <label class="form-label" for="athleteLogin">Логин спортсмена</label>
        <input 
          type="text" 
          class="form-input" 
          id="athleteLogin" 
          placeholder="ivan.donetsky42"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <div class="password-wrapper">
          <input 
            type="password" 
            class="form-input" 
            id="password" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-password" onclick="togglePassword()">
            👁️
          </button>
        </div>
      </div>

      <div class="form-footer">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>Запомнить меня</span>
        </label>
        <a href="#" class="forgot-password">Забыли пароль?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Войти
      </button>
    </form>

    <div class="divider">или</div>

    <div class="signup-link">
      Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
    </div>
  </div>
</div>

<script>
const AUTH_URL = 'https://primary-production-4b93e.up.railway.app/webhook/auth/register';
const ATHLETE_AUTH_URL = 'https://primary-production-4b93e.up.railway.app/webhook/athlete-login';
let currentRole = 'staff';

function switchRole(role) {
  currentRole = role;
  document.getElementById('btnStaff').classList.toggle('active', role === 'staff');
  document.getElementById('btnAthlete').classList.toggle('active', role === 'athlete');
  document.getElementById('emailGroup').style.display = role === 'staff' ? '' : 'none';
  document.getElementById('loginGroup').style.display = role === 'athlete' ? '' : 'none';
  document.getElementById('email').required = role === 'staff';
  document.getElementById('athleteLogin').required = role === 'athlete';
}

// Check if already logged in
const token = localStorage.getItem('token');
if (token) {
  const u = JSON.parse(localStorage.getItem('user')||'{}');
  // Спортсмен — токен не проверяем через me, просто редиректим
  if (u.role === 'athlete') {
    const aid = localStorage.getItem('athlete_id');
    if (aid) { window.location.href = '/athlete-profile.html?id=' + aid; }
  } else {
    // Тренер/директор — проверяем токен
    fetch(AUTH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'me', token })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success !== false) {
        if (u.role === 'director') window.location.href = '/director-dashboard.html';
        else if (u.role === 'superadmin') window.location.href = '/superadmin-dashboard.html';
        else window.location.href = 'children-list.html';
      }
    })
    .catch(err => console.error('Token verification error:', err));
  }
}

function togglePassword() {
  const input = document.getElementById('password');
  const btn = event.target;
  
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function showError(message) {
  const alert = document.getElementById('errorAlert');
  alert.textContent = message;
  alert.style.display = 'block';
  document.getElementById('successAlert').style.display = 'none';
  
  setTimeout(() => {
    alert.style.display = 'none';
  }, 5000);
}

function showSuccess(message) {
  const alert = document.getElementById('successAlert');
  alert.textContent = message;
  alert.style.display = 'block';
  document.getElementById('errorAlert').style.display = 'none';
}

async function handleLogin(event) {
  event.preventDefault();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  if (!password) { showError('Введите пароль'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>Вход...';

  try {
    if (currentRole === 'athlete') {
      // Логин спортсмена
      const login = document.getElementById('athleteLogin').value.trim();
      if (!login) { showError('Введите логин'); btn.disabled=false; btn.textContent='Войти'; return; }

      const response = await fetch(ATHLETE_AUTH_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password })
      });
      const data = await response.json();

      if (data.success && data.token && data.child) {
        showSuccess('Успешный вход!');
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify({ role: 'athlete', id: data.child.id, first_name: data.child.first_name, last_name: data.child.last_name }));
        localStorage.setItem('role', 'athlete');
        localStorage.setItem('user_id', data.child.id);
        localStorage.setItem('athlete_id', data.child.id);
        setTimeout(() => {
          window.location.href = '/athlete-profile.html?id=' + data.child.id;
        }, 800);
      } else {
        showError(data.error || 'Неверный логин или пароль');
        btn.disabled = false; btn.textContent = 'Войти';
      }

    } else {
      // Логин тренера/директора
      const email = document.getElementById('email').value.trim();
      if (!email) { showError('Введите email'); btn.disabled=false; btn.textContent='Войти'; return; }

      const response = await fetch(AUTH_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', email, password })
      });
      const data = await response.json();

      if (data.success && data.token) {
        showSuccess('Успешный вход! Перенаправление...');
        localStorage.setItem('token', data.token);
        if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
        setTimeout(() => {
          const role = data.user?.role || 'trainer';
          if (role === 'superadmin') window.location.href = '/superadmin-dashboard.html';
          else if (role === 'director') window.location.href = '/director-dashboard.html';
          else window.location.href = '/children-list.html';
        }, 1000);
      } else {
        showError(data.error || 'Неверный email или пароль');
        btn.disabled = false; btn.textContent = 'Войти';
      }
    }
  } catch (error) {
    console.error('Login error:', error);
    showError('Ошибка соединения с сервером');
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

// Demo credentials hint
setTimeout(() => {
  const demoHint = document.createElement('div');
  demoHint.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 20px; border-radius: 8px; font-size: 0.85rem; text-align: center; max-width: 90%; z-index: 1000;';
  demoHint.innerHTML = '💡 <strong>Тестовый аккаунт:</strong><br>trainer@bjj.com / password123';
  document.body.appendChild(demoHint);
  
  setTimeout(() => {
    demoHint.style.opacity = '0';
    demoHint.style.transition = 'opacity 0.5s';
    setTimeout(() => demoHint.remove(), 500);
  }, 8000);
}, 2000);
</script>

</body>
</html>
