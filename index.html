<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InSkill.online — Вхід</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
[data-theme="light"] {
  --bg:              #ffffff;
  --bg2:             #fafafa;
  --bg3:             #f5f5f5;
  --border:          #e8e8e8;
  --border2:         #d0d0d0;
  --text:            #1a1a1a;
  --muted:           #6b6b6b;
  --muted2:          #b0b0b0;
  --black:           #0a0a0a;
  --nav-bg:          rgba(255,255,255,.96);
  --input-bg:        #fafafa;
  --theme-btn-bg:    #f0f0f0;
  --theme-btn-color: #6b6b6b;
  --card-shadow:     0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  --accent:          #E53935;
}
[data-theme="dark"] {
  --bg:              #0a0a0a;
  --bg2:             #181818;
  --bg3:             #222222;
  --border:          #3d3d3d;
  --border2:         #505050;
  --text:            #ffffff;
  --muted:           #bbbbbb;
  --muted2:          #999999;
  --black:           #ffffff;
  --nav-bg:          rgba(10,10,10,.97);
  --input-bg:        #181818;
  --theme-btn-bg:    #222222;
  --theme-btn-color: #bbbbbb;
  --card-shadow:     0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --accent:          #E53935;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg2);
  color: var(--text);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ── TOP BAR ── */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: var(--nav-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 100;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background .2s, border-color .2s;
}
.top-bar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.logo-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--black);
  letter-spacing: -.03em;
  transition: color .2s;
}
.logo-text span { font-weight: 300; color: var(--accent); }

.top-bar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

/* ── THEME TOGGLE ── */
.theme-toggle {
  width: 32px; height: 32px;
  background: var(--theme-btn-bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
  color: var(--theme-btn-color);
}
.theme-toggle:hover { border-color: var(--border2); }

/* ── LANG SWITCHER ── */
.lang-switcher {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px;
  transition: background .2s, border-color .2s;
}
.lang-btn {
  padding: 3px 8px;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .02em;
}
.lang-btn.active {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

/* ── CARD ── */
.login-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
  margin-top: 48px;
  transition: background .2s, border-color .2s, box-shadow .2s;
}

.card-header {
  padding: 32px 32px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  transition: border-color .2s;
}

.card-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
  text-decoration: none;
}
.card-logo-text {
  font-size: 22px;
  font-weight: 600;
  color: var(--black);
  letter-spacing: -.03em;
  transition: color .2s;
}
.card-logo-text span { font-weight: 300; color: var(--accent); }

.card-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--black);
  margin-bottom: 4px;
  letter-spacing: -.02em;
  transition: color .2s;
}
.card-sub {
  font-size: 12px;
  color: var(--muted);
  transition: color .2s;
}

.card-body { padding: 24px 32px 32px; }

/* ── ROLE SWITCHER ── */
.role-sw {
  display: flex;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 3px;
  margin-bottom: 20px;
  gap: 3px;
  transition: background .2s, border-color .2s;
}
.role-btn {
  flex: 1;
  padding: 7px 8px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  background: transparent;
  color: var(--muted);
  transition: all .15s;
  white-space: nowrap;
}
.role-btn.active {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

/* ── FORM ── */
.form-group { margin-bottom: 14px; }

.form-label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  transition: color .2s;
}

.form-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  background: var(--input-bg);
  color: var(--text);
  transition: border-color .15s, box-shadow .15s, background .2s, color .2s;
  outline: none;
}
.form-input:focus {
  border-color: var(--border2);
  box-shadow: 0 0 0 3px rgba(0,0,0,.06);
}
[data-theme="dark"] .form-input:focus {
  box-shadow: 0 0 0 3px rgba(255,255,255,.06);
}
.form-input::placeholder { color: var(--muted2); }

.pw-wrap { position: relative; }
.pw-toggle {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  cursor: pointer;
  color: var(--muted2);
  padding: 4px;
  display: flex; align-items: center;
  transition: color .15s;
  line-height: 1;
}
.pw-toggle:hover { color: var(--text); }

/* ── FORM FOOTER ── */
.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  margin-top: 4px;
}
.remember {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
  transition: color .2s;
  user-select: none;
}
.remember input {
  width: 14px; height: 14px;
  cursor: pointer;
  accent-color: var(--black);
}
.forgot {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  transition: color .15s;
}
.forgot:hover { color: var(--text); }

/* ── BUTTON ── */
.btn-login {
  width: 100%;
  padding: 10px;
  background: var(--black);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: opacity .15s, background .2s, color .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-login:hover:not(:disabled) { opacity: .85; }
.btn-login:disabled { opacity: .4; cursor: not-allowed; }

/* ── SPINNER ── */
.spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.25);
  border-radius: 50%;
  border-top-color: var(--bg);
  animation: spin .6s linear infinite;
  display: none;
  flex-shrink: 0;
}
[data-theme="dark"] .spinner {
  border-color: rgba(0,0,0,.25);
  border-top-color: var(--bg);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DIVIDER ── */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 18px 0;
  color: var(--muted2);
  font-size: 11px;
  transition: color .2s;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
  transition: background .2s;
}

/* ── SIGNUP ── */
.signup {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  transition: color .2s;
}
.signup a {
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  transition: color .2s;
}
.signup a:hover { text-decoration: underline; }

/* ── ALERTS ── */
.alert {
  padding: 9px 12px;
  border-radius: 8px;
  margin-bottom: 14px;
  font-size: 12px;
  display: none;
  border: 1px solid transparent;
  line-height: 1.4;
}
.alert-error {
  background: #fff0f0;
  color: #c0392b;
  border-color: #ffd0d0;
}
[data-theme="dark"] .alert-error {
  background: #2a1010;
  color: #ff7070;
  border-color: #4a2020;
}
.alert-success {
  background: #f0fff4;
  color: #166534;
  border-color: #bbf7d0;
}
[data-theme="dark"] .alert-success {
  background: #0a2010;
  color: #4ade80;
  border-color: #1a4030;
}

/* ── MOBILE ── */
@media (max-width: 480px) {
  body { padding: 16px 12px; justify-content: flex-start; padding-top: 64px; }
  .login-card { border-radius: 12px; margin-top: 0; }
  .card-header { padding: 24px 20px 18px; }
  .card-body { padding: 18px 20px 24px; }
  .top-bar { padding: 0 16px; }
  .lang-btn { padding: 3px 6px; font-size: 10px; }
  .form-footer { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>
</head>

<!-- TOP BAR -->
<div class="top-bar">

/* ── i18n ── */
const i18n = {

function t(key) { return (i18n[currentLang] || i18n['uk'])[key] || key; }

function applyLang() {

  document.getElementById('t-no-account').textContent        = t('noAccount');
  document.getElementById('t-register').textContent          = t('register');
  // Update lang buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    const map = { 'UA': 'uk', 'RU': 'ru', 'EN': 'en' };
    btn.classList.toggle('active', map[btn.textContent] === currentLang);
  });
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  applyLang();
}

/* ── THEME ── */
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  document.getElementById('icon-sun').style.display  = isDark ? 'none'  : 'block';
  document.getElementById('icon-moon').style.display = isDark ? 'block' : 'none';
}

// Apply saved theme on load
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('icon-sun').style.display  = 'none';
    document.getElementById('icon-moon').style.display = 'block';
  }
})();

/* ── AUTH CHECK ── */
const token = localStorage.getItem('token');
if (token) {
  const u = JSON.parse(localStorage.getItem('user') || '{}');
  fetch(AUTH_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'me', token })
  })
  .then(res => res.json())
  .then(data => { if (data.success !== false) redirectByRole(u.role); })
  .catch(err => console.error('Token check error:', err));
}

function redirectByRole(role) {
  if (role === 'athlete') {
    window.location.href = '/athlete-profile-athlete.html?id=' + localStorage.getItem('athlete_id');
  } else if (role === 'director') {
    window.location.href = '/director-dashboard.html';
  } else if (role === 'superadmin') {
    window.location.href = '/superadmin-dashboard.html';
  } else if (role === 'accountant') {
    window.location.href = '/accounting.html';
  } else {
    window.location.href = '/children-list.html';
  }
}

function switchRole(role) {
  document.getElementById('btnStaff').classList.toggle('active',   role === 'staff');
  document.getElementById('btnAthlete').classList.toggle('active', role === 'athlete');
  document.getElementById('staffForm').style.display   = role === 'staff'   ? '' : 'none';
  document.getElementById('athleteForm').style.display = role === 'athlete' ? '' : 'none';
  document.getElementById('errorAlert').style.display   = 'none';
  document.getElementById('successAlert').style.display = 'none';
}

function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  const isText = input.type === 'text';
  input.type = isText ? 'password' : 'text';
  btn.innerHTML = isText
    ? '<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1 7.5S3.5 3 7.5 3s6.5 4.5 6.5 4.5S11.5 12 7.5 12 1 7.5 1 7.5z" stroke="currentColor" stroke-width="1.2"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.2"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2l11 11M6.2 6.3A1.5 1.5 0 009.7 9M4.5 4.6C2.8 5.7 1 7.5 1 7.5S3.5 12 7.5 12c1.2 0 2.3-.4 3.2-1M7.5 3c4 0 6.5 4.5 6.5 4.5s-.7 1.1-1.9 2.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
}

function showError(msg) {
  const el = document.getElementById('errorAlert');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('successAlert').style.display = 'none';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function showSuccess(msg) {
  const el = document.getElementById('successAlert');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('errorAlert').style.display = 'none';
}

async function handleStaffLogin(event) {
  event.preventDefault();
  const email    = document.getElementById('staffEmail').value.trim();
  const password = document.getElementById('staffPassword').value;
  const btn      = document.getElementById('staffLoginBtn');
  const spinner  = document.getElementById('staffSpinner');
  const btnText  = document.getElementById('t-login-btn');

  if (!email)    { showError(t('errEmail'));    return; }
  if (!password) { showError(t('errPassword')); return; }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = t('entering');

  try {
    const response = await fetch(AUTH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', email, password })
    });
    const data = await response.json();
    if (data.success && data.token) {
      showSuccess(t('successLogin'));
      localStorage.setItem('token', data.token);
      if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
      setTimeout(() => { redirectByRole(data.user?.role || 'trainer'); }, 1000);
    } else {
      showError(data.error || t('errWrongCreds'));
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = t('loginBtn');
    }
  } catch (error) {
    console.error('Login error:', error);
    showError(t('errConnection'));
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = t('loginBtn');
  }
}

async function handleAthleteLogin(event) {
  event.preventDefault();
  const login    = document.getElementById('athleteLogin').value.trim();
  const password = document.getElementById('athletePassword').value;
  const btn      = document.getElementById('athleteLoginBtn');
  const spinner  = document.getElementById('athleteSpinner');
  const btnText  = document.getElementById('t-athlete-login-btn');

  if (!login)    { showError(t('errLogin'));    return; }
  if (!password) { showError(t('errPassword')); return; }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = t('entering');

  try {
    let data = null;
    for (let attempt = 1; attempt <= 2; attempt++) {
      const response = await fetch(ATHLETE_AUTH_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password })
      });
      const text = await response.text();
      if (!text || !text.trim()) {
        if (attempt === 1) {
          btnText.textContent = t('connecting');
          await new Promise(r => setTimeout(r, 2500));
          continue;
        }
        throw new Error('empty_response');
      }
      data = JSON.parse(text);
      break;
    }
    if (data.success && data.token && data.child) {
      showSuccess(t('successLogin'));
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify({
        role: 'athlete', id: data.child.id,
        first_name: data.child.first_name,
        last_name: data.child.last_name
      }));
      localStorage.setItem('role', 'athlete');
      localStorage.setItem('user_id', data.child.id);
      localStorage.setItem('athlete_id', data.child.id);
      setTimeout(() => {
        window.location.href = '/athlete-profile-athlete.html?id=' + data.child.id;
      }, 800);
    } else {
      showError(data.error || t('errWrongCredsAth'));
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = t('loginBtn');
    }
  } catch (error) {
    console.error('Athlete login error:', error);
    showError(t('errConnection'));
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = t('loginBtn');
  }
}

// Init lang
applyLang();
</script>
