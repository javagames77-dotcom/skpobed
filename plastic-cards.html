<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пластикові карти — InSkill.online</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{--bg:#ffffff;--bg2:#fafafa;--bg3:#f5f5f5;--border:#e8e8e8;--border2:#d0d0d0;--text:#1a1a1a;--muted:#6b6b6b;--muted2:#b0b0b0;--black:#0a0a0a;--nav-bg:rgba(255,255,255,.96);--sidebar-bg:#ffffff;--input-bg:#fafafa;--card-bg:#ffffff;--card-shadow:0 1px 3px rgba(0,0,0,.06);--tbl-hover:#fafafa;--accent:#E53935;--tag-green-bg:#f0fdf4;--tag-green:#16a34a;--tag-red-bg:#fff0f0;--tag-red:#c0392b;--tag-blue-bg:#eff6ff;--tag-blue:#1d4ed8;--p:#0066CC;--s:#FF9933}
[data-theme="dark"]{--bg:#0a0a0a;--bg2:#181818;--bg3:#222222;--border:#3d3d3d;--border2:#505050;--text:#ffffff;--muted:#bbbbbb;--muted2:#999999;--black:#ffffff;--nav-bg:rgba(10,10,10,.97);--sidebar-bg:#0a0a0a;--input-bg:#181818;--card-bg:#181818;--card-shadow:0 1px 3px rgba(0,0,0,.3);--tbl-hover:#222222;--accent:#E53935;--tag-green-bg:#0a2010;--tag-green:#4ade80;--tag-red-bg:#2a1010;--tag-red:#ff7070;--tag-blue-bg:#0c1a3a;--tag-blue:#93c5fd;--p:#4d9de0;--s:#FF9933}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg2);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

/* NAV */
.nav{height:48px;background:var(--nav-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:200;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.logo-text{font-size:15px;font-weight:600;color:var(--black);letter-spacing:-.03em;transition:color .2s}
.logo-text span{font-weight:300;color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav-badge{font-size:10px;font-weight:500;color:var(--muted);background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;letter-spacing:.02em}
.nav-divider{width:1px;height:18px;background:var(--border);flex-shrink:0}
.theme-toggle{width:32px;height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:all .15s}
.theme-toggle:hover{border-color:var(--border2)}
.lang-switcher{display:flex;align-items:center;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:3px;transition:all .2s}
.lang-btn{padding:3px 8px;border:none;border-radius:5px;background:transparent;color:var(--muted);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.lang-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 48px)}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .2s,border-color .2s;overflow-y:auto}
.sidebar-user{padding:14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:32px;height:32px;border-radius:50%;background:var(--black);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;transition:all .2s}
.sidebar-user-name{font-size:12px;font-weight:500;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.sidebar-user-id{font-size:10px;color:var(--muted2)}
.sidebar-section{padding:14px 12px 6px;font-size:10px;font-weight:500;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 6px;border:none;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .12s;text-align:left;width:calc(100% - 12px);text-decoration:none}
.sitem:hover{background:var(--bg3);color:var(--text)}
.sitem.active{background:var(--bg3);color:var(--black)}
.sitem svg{flex-shrink:0}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:24px}

/* PAGE HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:16px;font-weight:600;color:var(--black);letter-spacing:-.02em}

/* CARDS */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--card-shadow);margin-bottom:16px;transition:all .2s}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{font-size:13px;font-weight:600;color:var(--black)}
.card-body{padding:18px}

/* FORM */
.form-group{margin-bottom:14px}
.form-group:last-child{margin-bottom:0}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-input{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--input-bg);color:var(--text);font-size:12px;font-family:inherit;transition:border-color .15s;outline:none}
.form-input:focus{border-color:var(--border2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* GRID LAYOUT */
.page-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.page-grid{grid-template-columns:1fr}}

/* CARD PREVIEW */
.card-preview-wrap{display:flex;flex-direction:column;gap:12px}
.preview-label{font-size:10px;font-weight:500;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.plastic-card{width:100%;max-width:323px;height:204px;border-radius:12px;position:relative;overflow:hidden;background:#fff;border:1px solid #e0e0e0;box-shadow:0 2px 14px rgba(0,0,0,.11);flex-shrink:0}

/* LOGO UPLOAD */
.logo-upload-area{border:1.5px dashed var(--border2);border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg3);position:relative}
.logo-upload-area:hover{border-color:var(--accent);background:var(--bg)}
.logo-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.logo-preview{width:60px;height:36px;object-fit:contain;display:none;margin:0 auto 6px}
.logo-upload-icon{color:var(--muted2);margin-bottom:4px}
.logo-upload-text{font-size:11px;color:var(--muted);line-height:1.4}

/* ATHLETES LIST */
.group-section{margin-bottom:16px}
.group-header{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;user-select:none}
.group-header-name{font-size:12px;font-weight:600;color:var(--black)}
.group-header-count{font-size:10px;color:var(--muted2);background:var(--bg3);border-radius:10px;padding:1px 7px}
.group-chevron{color:var(--muted2);transition:transform .2s;flex-shrink:0}
.group-chevron.open{transform:rotate(90deg)}
.athletes-list{display:none}
.athletes-list.open{display:block}
.athlete-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.athlete-row:last-child{border-bottom:none}
.athlete-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.athlete-photo{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.athlete-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.athlete-name{font-size:12px;font-weight:500;color:var(--black);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.athlete-meta{font-size:10px;color:var(--muted2);white-space:nowrap}
.athlete-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.dl-btn{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg);display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:all .12s}
.dl-btn:hover{border-color:var(--border2);color:var(--black)}
.dl-btn.visible{display:flex}
.dl-btn-pdf{color:var(--accent)}

/* SELECT ALL */
.select-all-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:4px}
.select-all-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.select-all-label{font-size:11px;color:var(--muted);cursor:pointer}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;border:1px solid var(--border)}
.btn-primary{background:var(--black);color:var(--bg);border-color:var(--black)}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:var(--bg);color:var(--text)}
.btn-secondary:hover{background:var(--bg3)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:var(--bg);padding:9px 18px;border-radius:8px;font-size:12px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#c0392b}

/* SKELETON */
.skeleton{background:var(--bg3);border-radius:6px;animation:skpulse 1.2s ease-in-out infinite}
@keyframes skpulse{0%,100%{opacity:1}50%{opacity:.4}}

/* EMPTY */
.empty-state{text-align:center;padding:32px 16px;color:var(--muted)}
.empty-icon{margin-bottom:10px;opacity:.3}
.empty-text{font-size:12px}

/* LOADING */
.loading-spinner{display:flex;align-items:center;justify-content:center;padding:24px;color:var(--muted2);font-size:12px;gap:8px}

/* MOBILE NAV */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);border-top:1px solid var(--border);backdrop-filter:blur(10px);z-index:100}
.mob-nav-items{display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.mob-nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);border:none;background:none;cursor:pointer;padding:4px 10px;font-family:inherit}
@media(max-width:768px){.sidebar{display:none}.mob-nav{display:block}.main{padding:16px;padding-bottom:70px}.page-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <a href="/director-dashboard.html" class="nav-logo">
    <svg width="23" height="23" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="1" width="18" height="18" rx="4.5" stroke="var(--black)" stroke-width="1.3"/>
      <path d="M5 15L13 7" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M8 7h5v5" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">InSkill<span>.online</span></span>
  </a>
  <div class="nav-right">
    <span class="nav-badge" id="nav-badge">ДИРЕКТОР</span>
    <div class="nav-divider"></div>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M13.5 10A6 6 0 015 2.5a6 6 0 108 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </div>
</nav>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-user">
    <div class="sidebar-avatar" id="sideInitials">ДР</div>
    <div>
      <div class="sidebar-user-name" id="sideUserName">—</div>
      <div class="sidebar-user-id" id="sideUserId"></div>
    </div>
  </div>

  <div class="sidebar-section" id="lbl-side-section">Пластикові карти</div>
  <a href="#" class="sitem active">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M1 6.5h14" stroke="currentColor" stroke-width="1.2"/><path d="M4 9.5h3M10 9.5h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <span id="lbl-side-cards">Пластикові карти</span>
  </a>

  <div class="sidebar-section" id="lbl-side-nav">Навігація</div>
  <a href="/director-dashboard.html" class="sitem">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L6 8l4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="lbl-back">← Панель директора</span>
  </a>
</aside>

<!-- MAIN -->
<main class="main">

  <div class="page-header">
    <h1 class="page-title" id="lbl-page-title">Пластикові карти</h1>
  </div>

  <div class="page-grid">

    <!-- ЛЕВАЯ КОЛОНКА: НАСТРОЙКИ -->
    <div>

      <!-- НАСТРОЙКИ КАРТЫ -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="lbl-card-settings">Налаштування карти</span>
        </div>
        <div class="card-body">

          <!-- Язык карты -->
          <div class="form-group">
            <label class="form-label" id="lbl-card-lang">Мова карти</label>
            <div style="display:flex;gap:6px">
              <button class="btn btn-primary" id="lang-ua" onclick="setCardLang('uk')" style="flex:1;justify-content:center">UA</button>
              <button class="btn btn-secondary" id="lang-ru" onclick="setCardLang('ru')" style="flex:1;justify-content:center">RU</button>
              <button class="btn btn-secondary" id="lang-en" onclick="setCardLang('en')" style="flex:1;justify-content:center">EN</button>
            </div>
          </div>

          <!-- Название клуба -->
          <div class="form-group">
            <label class="form-label" id="lbl-club-name-f">Назва клубу</label>
            <input type="text" class="form-input" id="inp-club-name" placeholder="СК Динамо Полтава" oninput="updatePreview()">
          </div>

          <!-- Лого клуба -->
          <div class="form-group">
            <label class="form-label" id="lbl-club-logo">Логотип клубу</label>
            <div class="logo-upload-area" id="logo-upload-area">
              <input type="file" accept="image/*" onchange="handleLogoUpload(event)">
              <img id="logo-preview-img" class="logo-preview" alt="logo">
              <div id="logo-upload-icon" class="logo-upload-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="1" y="1" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.2"/><path d="M10 6v8M6 10h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </div>
              <div class="logo-upload-text" id="lbl-logo-hint">Натисніть щоб завантажити</div>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:5px">
              <button class="btn btn-secondary" onclick="removeLogo()" id="btn-remove-logo" style="display:none;font-size:11px;padding:4px 10px" id="lbl-remove-logo">Видалити</button>
            </div>
          </div>

          <!-- Роль (опционально) -->
          <div class="form-group">
            <label class="form-label" id="lbl-role-f">Роль <span style="color:var(--muted2);font-weight:400;text-transform:none;letter-spacing:0" id="lbl-optional">(опціонально)</span></label>
            <input type="text" class="form-input" id="inp-role" placeholder="Учень, Тренер, Бухгалтер..." oninput="updatePreview()">
          </div>

          <!-- Срок действия -->
          <div class="form-group">
            <label class="form-label" id="lbl-valid-period">Термін дії</label>
            <div class="form-row">
              <div>
                <label class="form-label" id="lbl-valid-from">З</label>
                <input type="date" class="form-input" id="inp-valid-from" onchange="updatePreview()">
              </div>
              <div>
                <label class="form-label" id="lbl-valid-to">До</label>
                <input type="date" class="form-input" id="inp-valid-to" onchange="updatePreview()">
              </div>
            </div>
          </div>

          <!-- Контакты клуба (оборот) -->
          <div class="form-group">
            <label class="form-label" id="lbl-contacts-f">Контакти клубу <span style="color:var(--muted2);font-weight:400;text-transform:none;letter-spacing:0" id="lbl-optional2">(опціонально)</span></label>
            <input type="text" class="form-input" id="inp-address" placeholder="м. Полтава, вул. Соборності, 45" oninput="updatePreview()" style="margin-bottom:6px">
            <input type="text" class="form-input" id="inp-phone" placeholder="+38 050 123 45 67" oninput="updatePreview()" style="margin-bottom:6px">
            <input type="text" class="form-input" id="inp-website" placeholder="dynamo-poltava.ua" oninput="updatePreview()">
          </div>

        </div>
      </div>

    </div>

    <!-- ПРАВАЯ КОЛОНКА: ПРЕВЬЮ + ПЕРСОНАЛИЗАЦИЯ -->
    <div>

      <!-- ПРЕВЬЮ -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="lbl-preview-title">Попередній перегляд</span>
        </div>
        <div class="card-body">
          <div class="card-preview-wrap">

            <div>
              <div class="preview-label" id="lbl-front-side">Лицьова сторона</div>
              <!-- ЛИЦЕВАЯ КАРТА SVG -->
              <div style="max-width:323px">
                <svg id="card-front-svg" viewBox="0 0 323 204" width="100%" style="border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.11);display:block">
                  <!-- Фон -->
                  <rect width="323" height="204" rx="12" fill="#ffffff"/>
                  <!-- Красная полоса -->
                  <rect width="323" height="5" rx="0" fill="#E53935"/>
                  <!-- Фото -->
                  <rect x="16" y="20" width="66" height="80" rx="7" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
                  <g transform="translate(49,60)">
                    <circle cx="0" cy="-8" r="10" stroke="#c0c0c0" stroke-width="1.5" fill="none"/>
                    <path d="M-14 18c0-8 6.3-14 14-14s14 6 14 14" stroke="#c0c0c0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                  </g>
                  <!-- ФИО -->
                  <text id="svg-name" x="92" y="37" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">ПІБ СПОРТСМЕНА</text>
                  <!-- Дата рождения -->
                  <!-- Иконка календаря -->
                  <rect x="92" y="42" width="9" height="9" rx="1.5" stroke="#aaa" stroke-width="1.2" fill="none"/>
                  <line x1="92" y1="45.5" x2="101" y2="45.5" stroke="#aaa" stroke-width="1.2"/>
                  <line x1="94.5" y1="41" x2="94.5" y2="43.5" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
                  <line x1="98.5" y1="41" x2="98.5" y2="43.5" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
                  <text id="svg-dob" x="105" y="50" font-family="Inter,sans-serif" font-size="9" fill="#888">01.01.2010</text>
                  <!-- Роль -->
                  <rect id="svg-role-bg" x="92" y="55" width="60" height="14" rx="3" fill="#f0f0f0"/>
                  <!-- Иконка человека -->
                  <circle cx="97" cy="61" r="3" stroke="#555" stroke-width="1.2" fill="none"/>
                  <path d="M91.5 68c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="#555" stroke-width="1.2" stroke-linecap="round" fill="none"/>

/* ═══ LOGO UPLOAD ═══ */
function handleLogoUpload(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    logoDataUrl=ev.target.result;
    const img=document.getElementById('logo-preview-img');
    img.src=logoDataUrl;img.style.display='block';
    document.getElementById('logo-upload-icon').style.display='none';
    document.getElementById('btn-remove-logo').style.display='inline-flex';
    updatePreview();
  };
  reader.readAsDataURL(file);
}
function removeLogo(){
  logoDataUrl=null;
  document.getElementById('logo-preview-img').style.display='none';
  document.getElementById('logo-upload-icon').style.display='block';
  document.getElementById('btn-remove-logo').style.display='none';
  updatePreview();
}

/* ═══ PREVIEW UPDATE ═══ */
function fmtDate(d){if(!d)return'—';const p=d.split('-');if(p.length===3)return p[2]+'.'+p[1]+'.'+p[0];return d;}
function getYear(){
  const from=document.getElementById('inp-valid-from').value;
  if(from)return from.split('-')[0];
  return new Date().getFullYear().toString();
}
function genCardNum(idx){
  const y=getYear();
  return 'IS-'+y+'-'+String(idx||1).padStart(5,'0');
}

function updatePreview(){
  const clubName=document.getElementById('inp-club-name').value||tc('phClubName');
  const role=document.getElementById('inp-role').value;
  const validFrom=fmtDate(document.getElementById('inp-valid-from').value);
  const validTo=fmtDate(document.getElementById('inp-valid-to').value);
  const address=document.getElementById('inp-address').value||tc('phAddress');
  const phone=document.getElementById('inp-phone').value||tc('phPhone');
  const website=document.getElementById('inp-website').value||tc('phWebsite');
  const year=getYear();

  // Front
  const setT=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};
  setT('svg-club-name',clubName);
  setT('svg-year',year);
  setT('svg-club-label',tc('svgClubLabel'));
  setT('svg-role',role||'—');
  setT('svg-valid',(validFrom!=='—'||validTo!=='—')?validFrom+' — '+validTo:'');
  setT('svg-b-tagline1',tc('tagline1'));
  setT('svg-b-tagline2',tc('tagline2'));

  // Back contacts
  setT('svg-b-address',address);
  setT('svg-b-phone',phone);
  setT('svg-b-website',website);

  // Role visibility
  const roleEl=document.getElementById('svg-role');
  const roleBg=document.getElementById('svg-role-bg');
  if(roleEl&&roleBg){
    roleEl.style.display=role?'':'none';
    roleBg.style.display=role?'':'none';

/* ═══ LOAD DATA ═══ */
async function loadData(){
  try{
    // Параллельно грузим группы и спортсменов
    const [rg,rc]=await Promise.all([
      fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token,resource:'groups',action:'list'})}),
      fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token,resource:'children',action:'list'})})
    ]);
    const dg=await rg.json();
    const dc=await rc.json();
    allGroups=(dg.merged&&Array.isArray(dg.merged)?dg.merged:(Array.isArray(dg)?dg:[])).filter(g=>g&&g.id);
    allChildren=(dc.merged&&Array.isArray(dc.merged)?dc.merged:(Array.isArray(dc)?dc:[])).filter(c=>c&&c.id);
    renderAthletes();
  }catch(e){
    console.error(e);
    document.getElementById('athletes-container').innerHTML=
      '<div class="empty-state"><div class="empty-text" style="color:var(--tag-red)">'+t('errLoad')+'</div></div>';
  }
}

/* ═══ RENDER ATHLETES ═══ */
function renderAthletes(){
  const container=document.getElementById('athletes-container');
  if(!allGroups.length&&!allChildren.length){
    container.innerHTML='<div class="empty-state"><div class="empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.2"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></div><div class="empty-text">'+t('noAthletes')+'</div></div>';
    return;
  }
  // Группируем детей по группам
  const grouped={};
  allGroups.forEach(g=>{grouped[g.name]=[];});
  allChildren.forEach(c=>{
    const names=(c.group_names||'').split(', ').filter(n=>n&&n!=='Без группы'&&n!=='Без групи');
    if(!names.length){
      if(!grouped['—'])grouped['—']=[];
      grouped['—'].push(c);
    }else{
      names.forEach(n=>{
        if(!grouped[n])grouped[n]=[];
        grouped[n].push(c);
      });
    }
  });
  let html='';
  Object.entries(grouped).forEach(([groupName,children],gi)=>{
    if(!children.length)return;
    const gid='group-'+gi;
    html+=`<div class="group-section">
      <div class="group-header" onclick="toggleGroup('${gid}')">
        <svg class="group-chevron" id="chev-${gid}" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="group-header-name">${groupName}</span>
        <span class="group-header-count">${children.length}</span>
      </div>
      <div class="athletes-list" id="${gid}">
        <div class="select-all-row">
          <input type="checkbox" class="select-all-cb" id="sa-${gid}" onchange="selectAllGroup('${gid}',this.checked)">
          <label class="select-all-label" for="sa-${gid}">${t('selectAll')}</label>
        </div>
        ${children.map(c=>renderAthleteRow(c)).join('')}
      </div>
    </div>`;
  });
  if(!html){
    container.innerHTML='<div class="empty-state"><div class="empty-text">'+t('noAthletes')+'</div></div>';
    return;
  }
  container.innerHTML=html;
  // Обновляем кнопку генерации
  updateGenerateBtn();
  container.querySelectorAll('.athlete-cb').forEach(cb=>{
    cb.addEventListener('change',()=>{updateGenerateBtn();updateGroupSelectAll(cb);});
  });
}

function toggleGroup(gid){
  const list=document.getElementById(gid);
  const chev=document.getElementById('chev-'+gid);
  if(!list)return;
  list.classList.toggle('open');
  if(chev)chev.classList.toggle('open');
}

function selectAllGroup(gid,checked){
  const list=document.getElementById(gid);
  if(!list)return;
  list.querySelectorAll('.athlete-cb').forEach(cb=>{cb.checked=checked;});
  updateGenerateBtn();
}

function updateGroupSelectAll(changedCb){
  // Найдём родительский group list
  const row=changedCb.closest('.athlete-row');
  if(!row)return;
  const list=row.closest('.athletes-list');
  if(!list)return;
  const all=list.querySelectorAll('.athlete-cb');
  const allChecked=[...all].every(cb=>cb.checked);
  const sa=list.querySelector('.select-all-cb');
  if(sa)sa.checked=allChecked;
}

function updateGenerateBtn(){
  const checked=document.querySelectorAll('.athlete-cb:checked').length;
  const btn=document.getElementById('btn-generate');
  if(btn)btn.disabled=checked===0;
}

function svgToCanvas(svgStr,w,h){
  return new Promise(resolve=>{
    const blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}

async function generateCards(){
  const checked=[...document.querySelectorAll('.athlete-cb:checked')];
  if(!checked.length){showToast(t('noSelected'),'error');return;}

  const btn=document.getElementById('btn-generate');
  btn.disabled=true;
  const origText=btn.querySelector('span').textContent;
  btn.querySelector('span').textContent=t('generating');

  const settings={
    clubName:document.getElementById('inp-club-name').value||tc('phClubName'),
    role:document.getElementById('inp-role').value,
    validFrom:fmtDate(document.getElementById('inp-valid-from').value),
    validTo:fmtDate(document.getElementById('inp-valid-to').value),
    address:document.getElementById('inp-address').value||tc('phAddress'),
    phone:document.getElementById('inp-phone').value||tc('phPhone'),
    website:document.getElementById('inp-website').value||tc('phWebsite'),
    year:getYear(),
    logoUrl:logoDataUrl
  };

  for(let i=0;i<checked.length;i++){
    const cb=checked[i];
    const id=parseInt(cb.dataset.id);
    const child=allChildren.find(c=>c.id===id)||{
      id,first_name:cb.dataset.name.split(' ')[1]||'',
      last_name:cb.dataset.name.split(' ')[0]||'',
      birth_date:cb.dataset.dob,photo_url:cb.dataset.photo
    };
    child.dob=cb.dataset.dob;
    const {frontSVG,backSVG,cardNum}=buildCardSVG(child,i+1,settings);
    // Конвертируем оба SVG в canvas и объединяем в PNG (лицевая сверху, обратная снизу)
    const [fc,bc]=await Promise.all([
      svgToCanvas(frontSVG,1063,672),
      svgToCanvas(backSVG,1063,672)
    ]);
    let pngUrl=null;
    if(fc&&bc){
      const combined=document.createElement('canvas');
      combined.width=1063;combined.height=1344+40;
      const ctx=combined.getContext('2d');
      ctx.fillStyle='#f0f0f0';
      ctx.fillRect(0,0,combined.width,combined.height);
      ctx.drawImage(fc,0,0);
      ctx.drawImage(bc,0,672+40);
      pngUrl=combined.toDataURL('image/png');
    }
    generatedCards[id]={pngUrl,frontSVG,backSVG,cardNum,name:child.last_name+' '+child.first_name};
    // Показываем кнопки скачивания
    const dlPng=document.getElementById('dl-png-'+id);
    const dlPdf=document.getElementById('dl-pdf-'+id);
    if(dlPng)dlPng.classList.add('visible');
    if(dlPdf)dlPdf.classList.add('visible');
  }

  btn.disabled=false;
  btn.querySelector('span').textContent=origText;
  showToast(t('generated'));
  updateGenerateBtn();
}

async function downloadCard(id,type){
  const card=generatedCards[id];
  if(!card){showToast(t('errGenerate'),'error');return;}
  const safeName=(card.name||'card').replace(/\s+/g,'_');
  if(type==='png'&&card.pngUrl){
    const a=document.createElement('a');
    a.href=card.pngUrl;
    a.download='InSkill_'+safeName+'_'+card.cardNum+'.png';
    a.click();
  }else if(type==='pdf'){
    // Генерируем PDF с двумя страницами 90x58мм каждая (с вылетами 2мм = 94x62мм)
    // Используем SVG -> встраиваем в HTML -> печатаем
    const W=358,H=226; // 90+2*4=98px at 96dpi ~ 94x62mm at 96dpi, scaled
    const [fc,bc]=await Promise.all([
      svgToCanvas(card.frontSVG,1063,672),
      svgToCanvas(card.backSVG,1063,672)
    ]);
    if(!fc||!bc){showToast(t('errGenerate'),'error');return;}
    const frontPng=fc.toDataURL('image/png');
    const backPng=bc.toDataURL('image/png');
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <title>${safeName}</title>
      <style>
        @page{size:94mm 62mm;margin:2mm}
        body{margin:0;padding:0}
        .card-page{width:90mm;height:58mm;page-break-after:always;display:flex;align-items:center;justify-content:center}
        .card-page img{width:90mm;height:58mm;border-radius:3.18mm;display:block}
      </style></head><body>
      <div class="card-page"><img src="${frontPng}"></div>
      <div class="card-page" style="page-break-after:auto"><img src="${backPng}"></div>
      <script>window.onload=function(){window.print();}<\/script>
      </body></html>`;
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  }
}

/* ═══ INIT ═══ */
async function init(){
  // Тема
  const savedTheme=localStorage.getItem('theme');
  if(savedTheme==='dark'){
    document.documentElement.setAttribute('data-theme','dark');
    document.getElementById('icon-sun').style.display='none';
    document.getElementById('icon-moon').style.display='block';
  }
  // Пользователь
  try{
    const u=JSON.parse(localStorage.getItem('user')||'{}');
    const fn=u.first_name||'',ln=u.last_name||'';
    const ini=(fn[0]||'')+(ln[0]||'')||'ДР';
    document.getElementById('sideInitials').textContent=ini;
    document.getElementById('sideUserName').textContent=(fn+' '+ln).trim()||'—';
    document.getElementById('sideUserId').textContent=u.id?'ID '+u.id:'';
  }catch(e){}
  // Даты по умолчанию: с 1 января текущего года до 31 декабря
  const y=new Date().getFullYear();
  document.getElementById('inp-valid-from').value=y+'-01-01';
  document.getElementById('inp-valid-to').value=y+'-12-31';
  // Кнопка языка карты
  setCardLang(cardLang);
  applyLang();
  updatePreview();
  await loadData();
}

document.addEventListener('DOMContentLoaded',init);
</script>
