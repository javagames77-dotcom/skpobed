<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InSkill.online — Реєстрація</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
[data-theme="light"]{--bg:#ffffff;--bg2:#fafafa;--bg3:#f5f5f5;--border:#e8e8e8;--border2:#d0d0d0;--text:#1a1a1a;--muted:#6b6b6b;--muted2:#b0b0b0;--black:#0a0a0a;--nav-bg:rgba(255,255,255,.96);--input-bg:#fafafa;--theme-btn-bg:#f0f0f0;--theme-btn-color:#6b6b6b;--card-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);--accent:#E53935;--success:#16a34a;--success-bg:#f0fff4;--success-border:#bbf7d0;--danger:#c0392b;--danger-bg:#fff0f0;--danger-border:#ffd0d0}
[data-theme="dark"]{--bg:#0a0a0a;--bg2:#181818;--bg3:#222222;--border:#3d3d3d;--border2:#505050;--text:#ffffff;--muted:#bbbbbb;--muted2:#999999;--black:#ffffff;--nav-bg:rgba(10,10,10,.97);--input-bg:#181818;--theme-btn-bg:#222222;--theme-btn-color:#bbbbbb;--card-shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);--accent:#E53935;--success:#4ade80;--success-bg:#0a2010;--success-border:#1a4030;--danger:#ff7070;--danger-bg:#2a1010;--danger-border:#4a2020}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg2);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;display:flex;flex-direction:column;align-items:center;padding:72px 16px 40px}
.top-bar{position:fixed;top:0;left:0;right:0;height:48px;background:var(--nav-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s}
.top-bar-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo-text{font-size:15px;font-weight:600;color:var(--black);letter-spacing:-.03em;transition:color .2s}
.logo-text span{font-weight:300;color:var(--accent)}
.top-bar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.theme-toggle{width:32px;height:32px;background:var(--theme-btn-bg);border:1px solid var(--border);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--theme-btn-color)}
.theme-toggle:hover{border-color:var(--border2)}
.lang-switcher{display:flex;align-items:center;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:3px;transition:background .2s,border-color .2s}
.lang-btn{padding:3px 8px;border:none;border-radius:5px;background:transparent;color:var(--muted);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.lang-btn.active{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.page-header{width:100%;max-width:480px;text-align:center;margin-bottom:20px}
.page-title{font-size:20px;font-weight:600;color:var(--black);letter-spacing:-.03em;margin-bottom:4px;transition:color .2s}
.page-sub{font-size:12px;color:var(--muted);transition:color .2s}
.card{width:100%;max-width:480px;background:var(--bg);border:1px solid var(--border);border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden;transition:background .2s,border-color .2s,box-shadow .2s}
.role-sw{display:flex;background:var(--bg3);border-bottom:1px solid var(--border);transition:background .2s,border-color .2s}
.role-btn{flex:1;padding:12px 8px;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;background:transparent;color:var(--muted);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.role-btn.active{color:var(--black);border-bottom-color:var(--black);background:var(--bg)}
.form-body{padding:24px}
.section-label{font-size:10px;font-weight:500;color:var(--muted2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;margin-top:20px;padding-bottom:8px;border-bottom:1px solid var(--border);transition:color .2s,border-color .2s}
.section-label:first-child{margin-top:0}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:12px}
.form-label{display:block;margin-bottom:5px;font-size:12px;font-weight:500;color:var(--muted);transition:color .2s}
.req{color:var(--accent);margin-left:2px}
.form-input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--input-bg);color:var(--text);transition:border-color .15s,box-shadow .15s,background .2s,color .2s;outline:none}
.form-input:focus{border-color:var(--border2);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
[data-theme="dark"] .form-input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.form-input::placeholder{color:var(--muted2)}
.form-hint{font-size:11px;color:var(--muted2);margin-top:4px;line-height:1.4;transition:color .2s}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted2);padding:4px;display:flex;align-items:center;transition:color .15s;line-height:1}
.pw-toggle:hover{color:var(--text)}
.pwd-strength{display:flex;gap:4px;margin-top:6px}
.pwd-bar{height:3px;flex:1;border-radius:2px;background:var(--border);transition:background .3s}
.photo-upload{border:1px dashed var(--border2);border-radius:10px;padding:20px 16px;text-align:center;cursor:pointer;transition:all .2s;position:relative;background:var(--input-bg)}
.photo-upload:hover{border-color:var(--black);background:var(--bg3)}
.photo-upload.has-photo{border-color:var(--success);border-style:solid}
.photo-upload input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:none;border:2px solid var(--border)}
.photo-upload.has-photo .photo-preview{border-color:var(--success)}
.photo-icon-wrap{margin-bottom:8px;color:var(--muted2)}
.photo-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px;transition:color .2s}
.photo-sub{font-size:11px;color:var(--muted2);transition:color .2s}
.photo-uploading{display:none;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px}
.info-box{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px;transition:background .2s,border-color .2s}
.info-box-title{font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px;transition:color .2s}
.info-box-text{font-size:11px;color:var(--muted);line-height:1.5;transition:color .2s}
.btn-submit{width:100%;padding:10px;background:var(--black);color:var(--bg);border:none;border-radius:8px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:opacity .15s,background .2s,color .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px}
.btn-submit:hover:not(:disabled){opacity:.85}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-radius:50%;border-top-color:var(--bg);animation:spin .6s linear infinite;display:none;flex-shrink:0}
[data-theme="dark"] .spinner{border-color:rgba(0,0,0,.25);border-top-color:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:9px 12px;border-radius:8px;margin:16px 24px 0;font-size:12px;display:none;border:1px solid transparent;line-height:1.4;align-items:flex-start;gap:6px}
.alert.show{display:flex}
.alert-error{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-border)}
.alert-success{background:var(--success-bg);color:var(--success);border-color:var(--success-border)}
.success-state{display:none;padding:40px 24px;text-align:center}
.success-state.show{display:block}
.success-icon-wrap{width:52px;height:52px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;transition:background .2s,border-color .2s;color:var(--success)}
.success-title{font-size:16px;font-weight:600;color:var(--black);margin-bottom:8px;letter-spacing:-.02em;transition:color .2s}
.success-msg{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px;transition:color .2s}
.btn-back{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:12px;font-weight:500;transition:all .15s}
.btn-back:hover{border-color:var(--border2)}
.card-footer{padding:14px 24px;border-top:1px solid var(--border);text-align:center;font-size:12px;color:var(--muted);transition:border-color .2s,color .2s}
.card-footer a{color:var(--text);text-decoration:none;font-weight:500}
.card-footer a:hover{text-decoration:underline}
@media(max-width:520px){
  body{padding:64px 12px 32px}
  .card{border-radius:12px}
  .form-body{padding:18px 16px}
  .form-row{grid-template-columns:1fr;gap:0}
  .alert{margin:12px 16px 0}
  .card-footer{padding:12px 16px}
  .success-state{padding:32px 16px}
  .top-bar{padding:0 16px}
  .lang-btn{padding:3px 6px;font-size:10px}
  .page-title{font-size:17px}
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="top-bar-logo">
    <svg width="23" height="23" viewBox="0 0 20 20" fill="none">
      <rect x="1" y="1" width="18" height="18" rx="4.5" stroke="var(--black)" stroke-width="1.3"/>
      <path d="M5 15L13 7" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M8 7h5v5" stroke="var(--black)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">InSkill<span>.online</span></span>
  </a>
  <div class="top-bar-right">
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none">
        <path d="M13.5 10A6 6 0 015 2.5a6 6 0 108 8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<div class="page-header">
  <div class="page-title" id="t-title"></div>
  <div class="page-sub" id="t-sub"></div>
</div>

<div class="card">
  <div class="role-sw">
    <button class="role-btn active" id="btnAthlete" onclick="switchRole('athlete')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 1l1.6 4.9H15l-4.4 3.2 1.7 5.1L8 11.3l-4.3 2.9 1.7-5.1L1 5.9h5.4L8 1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span id="t-role-athlete"></span>
    </button>
    <button class="role-btn" id="btnDirector" onclick="switchRole('director')">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M5 5V4a2 2 0 014 0v1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M1 9h14" stroke="currentColor" stroke-width="1.2"/><path d="M7 9v1.5M9 9v1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span id="t-role-director"></span>
    </button>
  </div>

  <div class="alert alert-error" id="errorAlert">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style="flex-shrink:0;margin-top:1px"><circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M6.5 4v3M6.5 9h.01" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <span id="errorText"></span>
  </div>

  <!-- ATHLETE FORM -->
  <form id="athleteForm" onsubmit="handleAthleteSubmit(event)">
    <div class="form-body">
      <div class="section-label" id="t-section-personal"></div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" id="t-first-name-label"></label>
          <input type="text" class="form-input" id="aFirstName" name="first_name" placeholder="Іван" autocomplete="given-name" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="t-last-name-label"></label>
          <input type="text" class="form-input" id="aLastName" name="last_name" placeholder="Іваненко" autocomplete="family-name" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" id="t-birth-label"></label>
        <input type="date" class="form-input" id="aBirthDate" max="2015-12-31">
      </div>
      <div class="form-group">
        <label class="form-label" id="t-phone-label"></label>
        <input type="tel" class="form-input" id="aPhone" placeholder="+380 XX XXX XX XX" autocomplete="tel">
      </div>

      <div class="section-label" id="t-section-photo"></div>
      <div class="form-group">
        <div class="photo-upload" id="photoUploadArea">
          <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoChange(event)">
          <img class="photo-preview" id="photoPreview" alt="">
          <div id="photoPlaceholder">
            <div class="photo-icon-wrap">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="15" rx="2" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="12.5" r="3.5" stroke="currentColor" stroke-width="1.3"/><path d="M9 5l1.5-2h3L15 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="photo-title" id="t-photo-title"></div>
            <div class="photo-sub" id="t-photo-sub"></div>
          </div>
          <div class="photo-uploading" id="photoUploading">
            <div class="spinner" style="display:block;border-top-color:var(--muted)"></div>
            <span id="t-photo-uploading"></span>
          </div>
        </div>
      </div>

      <div class="section-label" id="t-section-account"></div>
      <div class="form-group">
        <label class="form-label" id="t-login-label"></label>
        <input type="text" class="form-input" id="aLogin" name="athlete-login" placeholder="ivan.ivanenko42" autocomplete="username" required>
        <div class="form-hint" id="t-login-hint"></div>
      </div>
      <div class="form-group">
        <label class="form-label" id="t-password-label"></label>
        <div class="pw-wrap">
          <input type="password" class="form-input" id="aPassword" name="athlete-password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" autocomplete="new-password" oninput="checkPasswordStrength(this.value)" required style="padding-right:38px">
          <button type="button" class="pw-toggle" onclick="togglePwd('aPassword',this)">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M1 7.5S3.5 3 7.5 3s6.5 4.5 6.5 4.5S11.5 12 7.5 12 1 7.5 1 7.5z" stroke="currentColor" stroke-width="1.2"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
        <div class="pwd-strength"><div class="pwd-bar" id="pbar1"></div><div class="pwd-bar" id="pbar2"></div><div class="pwd-bar" id="pbar3"></div><div class="pwd-bar" id="pbar4"></div></div>
      </div>

      <div class="section-label" id="t-section-trainer"></div>
      <div class="form-group">
        <label class="form-label" id="t-trainer-label"></label>
        <input type="number" class="form-input" id="aTrainerId" name="trainer_id" placeholder="40" min="1">
        <div class="form-hint" id="t-trainer-hint"></div>
      </div>
      <button type="submit" class="btn-submit" id="athleteSubmitBtn">
        <span class="spinner" id="athleteSpinner"></span>
        <span id="t-athlete-submit"></span>
      </button>
    </div>
  </form>

  <!-- DIRECTOR FORM -->
  <form id="directorForm" onsubmit="handleDirectorSubmit(event)" style="display:none">
    <div class="form-body">
      <div class="section-label" id="t-d-section-personal"></div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" id="t-d-first-name-label"></label>
          <input type="text" class="form-input" id="dFirstName" name="first_name" placeholder="Олександр" autocomplete="given-name" required>
        </div>
        <div class="form-group">
          <label class="form-label" id="t-d-last-name-label"></label>
          <input type="text" class="form-input" id="dLastName" name="last_name" placeholder="Петренко" autocomplete="family-name" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" id="t-d-email-label"></label>
        <input type="email" class="form-input" id="dEmail" name="email" placeholder="director@club.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" id="t-d-phone-label"></label>
        <input type="tel" class="form-input" id="dPhone" placeholder="+380 XX XXX XX XX" autocomplete="tel">
      </div>
      <div class="section-label" id="t-d-section-club"></div>
      <div class="form-group">
        <label class="form-label" id="t-d-club-label"></label>
        <input type="text" class="form-input" id="dClubName" placeholder="СК Переможець">
      </div>
      <div class="info-box">
        <div class="info-box-title" id="t-info-title"></div>
        <div class="info-box-text" id="t-info-text"></div>
      </div>
      <button type="submit" class="btn-submit" id="directorSubmitBtn">
        <span class="spinner" id="directorSpinner"></span>
        <span id="t-director-submit"></span>
      </button>
    </div>
  </form>

  <!-- SUCCESS -->
  <div class="success-state" id="successState">
    <div class="success-icon-wrap">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M4 11l5 5 9-9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="success-title" id="successTitle"></div>
    <div class="success-msg" id="successMsg"></div>
    <a href="/" class="btn-back" id="t-back-btn"></a>
  </div>

  <div class="card-footer" id="cardFooter">
    <span id="t-have-account"></span> <a href="/" id="t-login-link"></a>
  </div>
</div>

<script>
const REGISTER_URL    = 'https://primary-production-4b93e.up.railway.app/webhook/inskill-register';

    't-have-account':'haveAccount','t-login-link':'loginLink','t-back-btn':'backBtn'
  };
  Object.entries(ids).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.textContent=t(key);});
  document.querySelectorAll('.lang-btn').forEach(btn=>{
    const map={'UA':'uk','RU':'ru','EN':'en'};
    btn.classList.toggle('active',map[btn.textContent]===currentLang);
  });
}
function setLang(lang){currentLang=lang;localStorage.setItem('lang',lang);applyLang();}

  document.getElementById('icon-sun').style.display=isDark?'block':'none';
  document.getElementById('icon-moon').style.display=isDark?'none':'block';
}

    document.getElementById('icon-moon').style.display='block';

function checkPasswordStrength(val){
  const colors=['#ef4444','#f97316','#eab308','#22c55e'];
  let score=0;
  if(val.length>=6)score++;
  if(val.length>=10)score++;
  if(/[A-Z]/.test(val)&&/[0-9]/.test(val))score++;
  if(/[^a-zA-Z0-9]/.test(val))score++;
  [1,2,3,4].forEach(i=>{document.getElementById('pbar'+i).style.background=i<=score?colors[score-1]:'var(--border)';});
}

async function handlePhotoChange(event){
  const file=event.target.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){showError(t('errFile'));return;}
  const area=document.getElementById('photoUploadArea');
  const placeholder=document.getElementById('photoPlaceholder');
  const uploading=document.getElementById('photoUploading');
  const preview=document.getElementById('photoPreview');
  placeholder.style.display='none';uploading.style.display='flex';
  area.classList.remove('has-photo');uploadedPhotoUrl=null;
  try{
    const compressed=await compressImage(file);
    // Convert to base64 and upload via Railway (not directly to Cloudinary)
    const b64=await new Promise(res=>{
      const reader=new FileReader();
      reader.onload=e=>res(e.target.result);
      reader.readAsDataURL(compressed);
    });
    const r=await fetch('https://primary-production-4b93e.up.railway.app/webhook/upload-registration-photo',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({file_base64:b64,file_mime:compressed.type||'image/jpeg'})
    });
    const data=await r.json();
    if(data.url||data.secure_url){
      uploadedPhotoUrl=data.url||data.secure_url;
      preview.src=uploadedPhotoUrl;preview.style.display='block';
      uploading.style.display='none';area.classList.add('has-photo');hideAlerts();
    }else{throw new Error('Upload failed');}
  }catch(e){
    uploading.style.display='none';placeholder.style.display='block';
    showError(t('errPhotoUpload'));
  }
}

async function compressImage(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=800;let w=img.width,h=img.height;
        if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(resolve,'image/jpeg',0.85);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleAthleteSubmit(e){
  e.preventDefault();hideAlerts();
  const firstName=document.getElementById('aFirstName').value.trim();
  const lastName=document.getElementById('aLastName').value.trim();
  const birthDate=document.getElementById('aBirthDate').value;
  const phone=document.getElementById('aPhone').value.trim();
  const login=document.getElementById('aLogin').value.trim();
  const password=document.getElementById('aPassword').value;
  const trainerId=document.getElementById('aTrainerId').value;
  const btn=document.getElementById('athleteSubmitBtn');
  const spinner=document.getElementById('athleteSpinner');
  const btnText=document.getElementById('t-athlete-submit');
  if(!uploadedPhotoUrl){showError(t('errPhoto'));return;}
  if(!login||!/^[a-zA-Z0-9._]{3,50}$/.test(login)){showError(t('errLogin'));return;}
  if(!password||password.length<6){showError(t('errPassword'));return;}
  btn.disabled=true;spinner.style.display='block';btnText.textContent=t('sending');
  try{
    const body={type:'athlete',first_name:firstName,last_name:lastName,login,password,photo_url:uploadedPhotoUrl};
    if(birthDate)body.birth_date=birthDate;
    if(phone)body.phone=phone;
    if(trainerId)body.trainer_id=parseInt(trainerId);
    const r=await fetch(REGISTER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    if(data.success){showSuccess('athlete',firstName);}
    else{showError(data.error||t('errRegistration'));btn.disabled=false;spinner.style.display='none';btnText.textContent=t('athleteSubmit');}
  }catch(err){
    showError(t('errConnection'));btn.disabled=false;spinner.style.display='none';btnText.textContent=t('athleteSubmit');
  }
}
